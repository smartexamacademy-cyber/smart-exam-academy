<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Exam Academy - Admin 3.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--p:#1d4ed8;--p2:#2563eb;--bg:#f4f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--ok:#16a34a;--er:#dc2626;--wa:#f59e0b;--soft:#eff6ff}
body.dark{--bg:#0f172a;--card:#1e293b;--tx:#e5e7eb;--mu:#94a3b8;--bd:#334155;--soft:#1e3a5f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:var(--p2);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.gr{background:var(--ok)}.btn.rd{background:var(--er)}.btn.gy{background:#64748b}.btn.or{background:var(--wa)}
.btn.ghost{background:var(--soft);color:var(--p2)}
.btn:disabled{opacity:.5}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#7c3aed)}
#login .box{background:#fff;color:#1f2937;border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#login h1{font-size:20px;text-align:center;margin:10px 0 4px}
#login p{text-align:center;color:#6b7280;font-size:13px;margin-bottom:12px}
#login input{background:#fff;color:#1f2937}
#loginErr{color:var(--er);font-size:13px;margin-top:8px;text-align:center}
/* layout */
#app{display:none}
header{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h2{font-size:16px;flex:1;line-height:1.2}header h2 small{display:block;font-weight:400;font-size:11px;opacity:.85}
header .btn{background:rgba(255,255,255,.18)}
.wrap{display:flex}
nav#side{width:220px;background:var(--card);border-right:1px solid var(--bd);min-height:calc(100vh - 56px);padding:12px;position:sticky;top:56px;align-self:flex-start}
nav#side a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:13px;margin-bottom:3px;cursor:pointer}
nav#side a .ct{margin-left:auto;font-size:11px;background:var(--bg);padding:1px 7px;border-radius:9px;color:var(--mu)}
nav#side a.on{background:var(--p2);color:#fff}nav#side a.on .ct{background:rgba(255,255,255,.25);color:#fff}
#tabs{display:none;overflow-x:auto;white-space:nowrap;padding:8px;gap:6px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:15}
#tabs a{display:inline-block;padding:7px 12px;border-radius:20px;background:var(--bg);margin-right:6px;font-size:12px;color:var(--tx);cursor:pointer}
#tabs a.on{background:var(--p2);color:#fff}
main{flex:1;padding:18px;min-width:0}
.title{font-size:18px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mu);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mu);padding:8px;border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.t-ok{background:#dcfce7;color:#166534}.t-off{background:#fee2e2;color:#991b1b}.t-pr{background:#fef3c7;color:#92400e}.t-bl{background:#dbeafe;color:#1e40af}.t-gy{background:#f1f5f9;color:#475569}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:130px}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:24px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;z-index:100;display:none;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .mb{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:8px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:10px}.chk input{width:auto}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
.qa{display:block;padding:14px;border-radius:10px;border:1px solid var(--bd);cursor:pointer;background:var(--soft)}
.qa i{font-size:18px;color:var(--p2)}.qa b{display:block;margin-top:6px}.qa span{font-size:12px;color:var(--mu)}
code{background:var(--bg);padding:2px 5px;border-radius:4px;font-size:12px}
@media(max-width:860px){nav#side{display:none}#tabs{display:block}.g3,.g4{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
@media(max-width:480px){.g2{grid-template-columns:1fr}header h2 small{display:none}.hide-m{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
 <div class="box">
  <div style="text-align:center;font-size:40px;color:#1d4ed8"><i class="fas fa-user-shield"></i></div>
  <h1>Smart Exam Academy</h1>
  <p>Admin Panel 3.0 — लॉगिन करें</p>
  <form onsubmit="doLogin(event)">
   <label>Admin Email</label><input id="lgEmail" type="email" required autocomplete="username">
   <label>Password</label><input id="lgPass" type="password" required autocomplete="current-password">
   <button class="btn" style="width:100%;justify-content:center;margin-top:16px;padding:12px"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
  </form>
  <div id="loginErr"></div>
 </div>
</div>

<!-- APP -->
<div id="app">
 <header>
  <i class="fas fa-graduation-cap" style="font-size:22px"></i>
  <h2>Smart Exam Academy Admin<small>Course · Subject · Chapter · Material · Users</small></h2>
  <span id="live" class="hide-m" style="font-size:11px;opacity:.9"><i class="fas fa-circle" style="color:#4ade80;font-size:8px"></i> Live</span>
  <button class="btn sm" onclick="toggleTheme()" title="Theme"><i class="fas fa-moon"></i></button>
  <button class="btn sm" onclick="logout()" style="background:#ef4444"><i class="fas fa-sign-out-alt"></i><span class="hide-m">Logout</span></button>
 </header>
 <div id="tabs"></div>
 <div class="wrap">
  <nav id="side"></nav>
  <main id="main"></main>
 </div>
</div>

<div class="modal" id="modal"><div class="mb" id="modalBody"></div></div>
<div id="toast"></div>

<script>
// ================= CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyAmBGqLzAyMyYgADKOOZIv8GQm6fxxNdw4",
  authDomain: "smart-exam-academy-b7101.firebaseapp.com",
  databaseURL: "https://smart-exam-academy-b7101-default-rtdb.firebaseio.com",
  projectId: "smart-exam-academy-b7101",
  storageBucket: "smart-exam-academy-b7101.firebasestorage.app",
  messagingSenderId: "894421555422",
  appId: "1:894421555422:web:116442b9bcad4d6eba0a4f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Admin login uses Firebase Authentication (no password in this file)
const auth = firebase.auth();
const ADMIN_EMAIL = "sonukumarbank9876@gmail.com";

const COURSES = [
 {id:'12th',name:'Class 12th'},{id:'10th',name:'Class 10th'},{id:'BA',name:'BA (Bachelor of Arts)'},
 {id:'BSC',name:'B.Sc (Bachelor of Science)'},{id:'BCOM',name:'B.Com (Bachelor of Commerce)'},
 {id:'Competitive',name:'Competitive Exams'},{id:'PAID_SECTION',name:'Premium Section'},{id:'SOCIAL_LINKS',name:'Social Links'}
];
const TYPES = [
 {id:'Notes',label:'Notes (PDF/DOC)',color:'#2196F3'},{id:'Videos',label:'Video Lecture',color:'#E91E63'},
 {id:'MCQ',label:'MCQ Practice',color:'#00c853'},{id:'QuizTest',label:'Quiz / Test',color:'#FF9800'},
 {id:'Books',label:'E-Book / Book',color:'#4CAF50'},{id:'QuestionBank',label:'Question Bank',color:'#9C27B0'},
 {id:'Syllabus',label:'Syllabus',color:'#00BCD4'},{id:'PDF',label:'PDF Document',color:'#F44336'},
 {id:'Link',label:'Web / Drive Link',color:'#607D8B'},{id:'Test',label:'Mock Test',color:'#ff6d00'},{id:'Other',label:'Other',color:'#795548'}
];
const NODES = ['subjects_v3','chapters_v3','materials_v3','students_v3','announcements_v3'];

// ================= STATE =================
const S = {subjects:[],chapters:[],materials:[],users:[],ann:[]};
let section='dashboard', charts=[], listening=false, renderTimer=null;
const UI = {chCourse:'12th',chSubject:'',subCourse:'12th',mf:{course:'',subject:'',chapter:'',type:'',access:'',pub:'',q:''},sel:new Set(),uq:'',up:{course:'12th',subject:'',chapter:''}};

// ================= HELPERS =================
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cName = id => (COURSES.find(c=>c.id===id)||{}).name || id || '-';
const sName = id => (S.subjects.find(s=>s.id===id)||{}).name || '';
const chName = id => { const c=S.chapters.find(c=>c.id===id); return c? chLabel(c):''; };
const chLabel = c => (c.chapterNumber!==undefined && c.chapterNumber!=='' ? 'Ch '+c.chapterNumber+' – ' : '') + (c.name||'');
const tColor = t => (TYPES.find(x=>x.id===t)||{color:'#64748b'}).color;
function toast(msg,type='ok'){const t=$('toast');t.textContent=msg;t.style.background={ok:'#16a34a',er:'#dc2626',wa:'#f59e0b',in:'#2563eb'}[type];t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000);}
function openModal(html){$('modalBody').innerHTML=html;$('modal').style.display='flex';}
function closeModal(){$('modal').style.display='none';}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function today(){return new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function parseD(m){const d=new Date(m.uploadTime||m.date||0);return isNaN(d)?0:d.getTime();}
function coursesOpts(sel,all){return (all?`<option value="">All Courses</option>`:'')+COURSES.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');}
function subjOpts(course,sel,all){return (all?`<option value="">All Subjects</option>`:'')+S.subjects.filter(s=>!course||s.courseId===course).sort((a,b)=>(a.order||0)-(b.order||0)).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}${s.active===false?' (off)':''}</option>`).join('');}
function chapOpts(subject,sel,first){return `<option value="">${first||'— Unassigned —'}</option>`+S.chapters.filter(c=>c.subjectId===subject).sort((a,b)=>(a.order||0)-(b.order||0)).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(chLabel(c))}</option>`).join('');}
function typeOpts(sel,all){return (all?`<option value="">All Types</option>`:'')+TYPES.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${t.label}</option>`).join('');}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;a.click();}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function parseCSV(text){const rows=[];let r=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){r.push(f);f='';}else if(c==='\n'){r.push(f);rows.push(r);r=[];f='';}else if(c!=='\r')f+=c;}}if(f!==''||r.length){r.push(f);rows.push(r);}return rows.filter(x=>x.some(v=>v.trim()!==''));}
// Google Drive / YouTube link cleanup
function normalizeUrl(u){
 u=(u||'').trim(); if(!u) return u;
 let m=u.match(/drive\.google\.com\/(?:open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/); if(m) return `https://drive.google.com/file/d/${m[1]}/view`;
 m=u.match(/youtu\.be\/([\w-]{11})/); if(m) return `https://www.youtube.com/watch?v=${m[1]}`;
 m=u.match(/youtube\.com\/shorts\/([\w-]{11})/); if(m) return `https://www.youtube.com/watch?v=${m[1]}`;
 if(!/^https?:\/\//i.test(u)) u='https://'+u;
 return u;
}
function linkKind(u){if(/youtube\.com|youtu\.be/.test(u))return 'YouTube';if(/drive\.google\.com|docs\.google\.com/.test(u))return 'Google Drive';if(/\.pdf(\?|$)/i.test(u))return 'PDF';if(/t\.me|telegram/.test(u))return 'Telegram';return 'Web link';}

// ================= AUTH =================
async function doLogin(e){
 e.preventDefault();$('loginErr').textContent='';
 const em=$('lgEmail').value.trim().toLowerCase(), pw=$('lgPass').value;
 if(em!==ADMIN_EMAIL){$('loginErr').textContent='यह admin email नहीं है';return;}
 try{await auth.signInWithEmailAndPassword(em,pw);}
 catch(err){$('loginErr').textContent=(err&&/network/i.test(err.code||''))?'Internet जाँचें':'गलत email या password';}
}
function logout(){auth.signOut().then(()=>location.reload());}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('sea_theme',document.body.classList.contains('dark')?'dark':'light');render();}
if(localStorage.getItem('sea_theme')==='dark')document.body.classList.add('dark');

function startApp(){
 $('login').style.display='none';$('app').style.display='block';
 if(listening) return; listening=true;
 const map={subjects_v3:'subjects',chapters_v3:'chapters',materials_v3:'materials',students_v3:'users',announcements_v3:'ann'};
 Object.entries(map).forEach(([node,key])=>{
  db.ref(node).on('value',snap=>{const arr=[];snap.forEach(ch=>{const v=ch.val();if(v&&typeof v==='object')arr.push({id:ch.key,...v});});S[key]=arr;scheduleRender();},
   err=>toast('Firebase error: '+err.message,'er'));
 });
 db.ref('.info/connected').on('value',s=>{$('live').innerHTML=s.val()?'<i class="fas fa-circle" style="color:#4ade80;font-size:8px"></i> Live':'<i class="fas fa-circle" style="color:#f87171;font-size:8px"></i> Offline';});
 render();
}
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>{ // don't wipe a form the admin is typing in
 const a=document.activeElement; if(a&&['INPUT','TEXTAREA'].includes(a.tagName)&&a.closest('#main')&&['upload','bulk','users','announcements'].includes(section)){renderNav();return;}
 if($('modal').style.display==='flex'){renderNav();return;}
 render();},150);}

// ================= NAV =================
const NAV=[
 ['dashboard','fa-gauge','Dashboard'],['subjects','fa-book','Subjects',()=>S.subjects.length],['chapters','fa-bookmark','Chapters',()=>S.chapters.length],
 ['materials','fa-layer-group','Materials',()=>S.materials.length],['upload','fa-cloud-arrow-up','Upload'],['bulk','fa-file-csv','Bulk Upload'],
 ['users','fa-users','Students',()=>S.users.length],['announcements','fa-bullhorn','Announcements',()=>S.ann.length],['tools','fa-screwdriver-wrench','Cleanup Tools'],['backup','fa-database','Backup']
];
function go(s){section=s;UI.sel.clear();render();window.scrollTo(0,0);}
function renderNav(){
 $('side').innerHTML='<div style="font-size:11px;color:var(--mu);font-weight:700;margin:4px 8px 8px">NAVIGATION</div>'+NAV.map(n=>`<a class="${section===n[0]?'on':''}" onclick="go('${n[0]}')"><i class="fas ${n[1]}"></i>${n[2]}${n[3]?`<span class="ct">${n[3]()}</span>`:''}</a>`).join('');
 $('tabs').innerHTML=NAV.map(n=>`<a class="${section===n[0]?'on':''}" onclick="go('${n[0]}')"><i class="fas ${n[1]}"></i> ${n[2]}</a>`).join('');
}
function render(){
 renderNav(); charts.forEach(c=>c.destroy()); charts=[];
 const f={dashboard:vDash,subjects:vSubjects,chapters:vChapters,materials:vMaterials,upload:vUpload,bulk:vBulk,users:vUsers,announcements:vAnn,tools:vTools,backup:vBackup}[section];
 $('main').innerHTML=f(); if(section==='dashboard')drawCharts(); if(section==='upload')updPreview();
}

// ================= DASHBOARD =================
function vDash(){
 const pub=S.materials.filter(m=>m.published!==false).length, prem=S.materials.filter(m=>(m.accessLevel||m.access)==='premium').length;
 const un=S.materials.filter(m=>!m.chapterId).length;
 const recent=[...S.materials].sort((a,b)=>parseD(b)-parseD(a)).slice(0,8);
 const st=(ic,bg,n,l,s)=>`<div class="card stat" onclick="go('${s}')" style="cursor:pointer;margin:0"><div class="ic" style="background:${bg}"><i class="fas ${ic}"></i></div><div><b>${n}</b><span>${l}</span></div></div>`;
 return `<div class="title"><i class="fas fa-gauge" style="color:var(--p2)"></i> Dashboard</div><div class="sub">${new Date().toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
 <div class="grid g4" style="margin-bottom:14px">
  ${st('fa-book','#2563eb',S.subjects.length,'Subjects','subjects')}${st('fa-bookmark','#16a34a',S.chapters.length,'Chapters','chapters')}
  ${st('fa-file-lines','#ea580c',S.materials.length,'Materials','materials')}${st('fa-users','#7c3aed',S.users.length,'Students','users')}
 </div>
 <div class="grid g3" style="margin-bottom:14px">
  ${st('fa-eye','#0891b2',pub,'Published','materials')}${st('fa-crown','#d97706',prem,'Premium','materials')}${st('fa-triangle-exclamation','#dc2626',un,'Chapter नहीं जुड़ा','tools')}
 </div>
 <div class="card"><h3><i class="fas fa-bolt" style="color:#f59e0b"></i> Quick Actions</h3><div class="grid g4">
  <a class="qa" onclick="go('upload')"><i class="fas fa-cloud-arrow-up"></i><b>Upload Material</b><span>Notes, video, test</span></a>
  <a class="qa" onclick="go('bulk')"><i class="fas fa-file-csv"></i><b>Bulk Upload</b><span>CSV से एक साथ</span></a>
  <a class="qa" onclick="go('chapters')"><i class="fas fa-bookmark"></i><b>Chapters</b><span>Add / order</span></a>
  <a class="qa" onclick="go('announcements')"><i class="fas fa-bullhorn"></i><b>Announcement</b><span>Students को सूचना</span></a>
 </div></div>
 <div class="grid g2"><div class="card"><h3><i class="fas fa-chart-bar"></i> Course-wise Materials</h3><canvas id="c1" height="200"></canvas></div>
 <div class="card"><h3><i class="fas fa-chart-pie"></i> Type-wise Materials</h3><canvas id="c2" height="200"></canvas></div></div>
 <div class="card"><h3><i class="fas fa-clock-rotate-left"></i> Recently Added <a style="margin-left:auto;font-size:12px;color:var(--p2);cursor:pointer" onclick="go('materials')">View all</a></h3>
 <div class="tw"><table><tr><th>Title</th><th>Course</th><th>Subject</th><th>Chapter</th><th>Type</th><th>Date</th></tr>
 ${recent.map(m=>`<tr><td>${esc(m.title||m.tit)}</td><td>${esc(m.courseId||m.cat)}</td><td>${esc(m.sub||sName(m.subjectId))}</td><td>${m.chapterId?esc(m.chapterName||chName(m.chapterId)):'<span class="tag t-off">Unassigned</span>'}</td><td><span class="tag" style="background:${tColor(m.type)}22;color:${tColor(m.type)}">${esc(m.type)}</span></td><td>${esc(m.date)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">No materials</td></tr>'}
 </table></div></div>`;
}
function drawCharts(){
 if(!window.Chart)return; const tc=getComputedStyle(document.body).getPropertyValue('--mu');
 const byC=COURSES.map(c=>S.materials.filter(m=>(m.courseId||m.cat)===c.id).length);
 charts.push(new Chart($('c1'),{type:'bar',data:{labels:COURSES.map(c=>c.id),datasets:[{label:'Materials',data:byC,backgroundColor:'#2563eb',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc}},y:{ticks:{color:tc,precision:0}}}}}));
 const tt=TYPES.filter(t=>S.materials.some(m=>m.type===t.id));
 charts.push(new Chart($('c2'),{type:'doughnut',data:{labels:tt.map(t=>t.id),datasets:[{data:tt.map(t=>S.materials.filter(m=>m.type===t.id).length),backgroundColor:tt.map(t=>t.color)}]},options:{plugins:{legend:{position:'right',labels:{color:tc,boxWidth:12}}}}}));
}

async function addSubject(){const n=$('nsName').value.trim();if(!n)return toast('नाम लिखें','er');
 if(S.subjects.some(s=>s.courseId===UI.subCourse&&s.name.trim().toLowerCase()===n.toLowerCase()))return toast('यह subject पहले से है','wa');
 await db.ref('subjects_v3').push({name:n,courseId:UI.subCourse,order:+$('nsOrder').value||1,active:true,createdAt:new Date().toISOString()});toast('Subject जुड़ गया');}
function editSubject(id){const s=S.subjects.find(x=>x.id===id);openModal(`<h3>Edit Subject</h3><label>Name</label><input id="esName" value="${esc(s.name)}"><label>Course</label><select id="esCourse">${coursesOpts(s.courseId)}</select><label>Order</label><input id="esOrder" type="number" value="${s.order||1}">
 <div class="hint">नाम बदलने पर इसके सभी materials में भी subject नाम अपडेट होगा।</div><div class="acts" style="margin-top:14px"><button class="btn" onclick="saveSubject('${id}')">Save</button><button class="btn gy" onclick="closeModal()">Cancel</button></div>`);}
async function saveSubject(id){const n=$('esName').value.trim();if(!n)return;const u={};u[`subjects_v3/${id}/name`]=n;u[`subjects_v3/${id}/courseId`]=$('esCourse').value;u[`subjects_v3/${id}/order`]=+$('esOrder').value||1;
 S.materials.filter(m=>m.subjectId===id).forEach(m=>u[`materials_v3/${m.id}/sub`]=n);S.chapters.filter(c=>c.subjectId===id).forEach(c=>u[`chapters_v3/${c.id}/courseId`]=$('esCourse').value);
 await db.ref().update(u);closeModal();toast('Saved');}
async function delSubject(id){const nc=S.chapters.filter(c=>c.subjectId===id).length,nm=S.materials.filter(m=>m.subjectId===id).length;
 if(!confirm(`"${sName(id)}" delete करें?\nइसके ${nc} chapters भी हटेंगे।${nm?`\n${nm} materials "Unassigned" हो जाएँगे (हटेंगे नहीं).`:''}`))return;
 const u={};u[`subjects_v3/${id}`]=null;S.chapters.filter(c=>c.subjectId===id).forEach(c=>u[`chapters_v3/${c.id}`]=null);
 S.materials.filter(m=>m.subjectId===id).forEach(m=>{u[`materials_v3/${m.id}/subjectId`]='';u[`materials_v3/${m.id}/chapterId`]='';u[`materials_v3/${m.id}/chapterName`]='';});
 await db.ref().update(u);toast('Deleted');}
async function moveItem(node,id,dir){
 const arr=node==='subjects_v3'?S.subjects.filter(s=>s.courseId===UI.subCourse):S.chapters.filter(c=>c.subjectId===UI.chSubject);
 arr.sort((a,b)=>(a.order||0)-(b.order||0));const i=arr.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=arr.length)return;
 [arr[i],arr[j]]=[arr[j],arr[i]];const u={};arr.forEach((x,k)=>u[`${node}/${x.id}/order`]=k+1);await db.ref().update(u);}

 <td class="acts"><button class="btn sm ghost" onclick="moveItem('chapters_v3','${c.id}',-1)" ${i===0?'disabled':''}><i class="fas fa-arrow-up"></i></button><button class="btn sm ghost" onclick="moveItem('chapters_v3','${c.id}',1)" ${i===list.length-1?'disabled':''}><i class="fas fa-arrow-down"></i></button>
 <button class="btn sm ghost" onclick="editChapter('${c.id}')"><i class="fas fa-pen"></i></button><button class="btn sm ${c.active===false?'gr':'gy'}" onclick="db.ref('chapters_v3/${c.id}/active').set(${c.active===false})"><i class="fas ${c.active===false?'fa-eye':'fa-eye-slash'}"></i></button>
 <button class="btn sm rd" onclick="delChapter('${c.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">अभी कोई chapter नहीं</td></tr>'}</table></div></div>`
 :'<div class="card empty">इस course में पहले एक subject बनाइए।</div>'}`;
}
async function addChapter(){const n=$('ncName').value.trim();if(!n)return toast('नाम लिखें','er');
 await db.ref('chapters_v3').push({name:n,chapterNumber:$('ncNum').value.trim(),courseId:UI.chCourse,subjectId:UI.chSubject,order:+$('ncOrder').value||1,active:true,createdAt:new Date().toISOString()});toast('Chapter जुड़ गया');}
async function bulkChapters(){const lines=$('ncBulk').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;
 let base=S.chapters.filter(c=>c.subjectId===UI.chSubject).length;const u={};
 lines.forEach((n,k)=>{const key=db.ref('chapters_v3').push().key;u[`chapters_v3/${key}`]={name:n,chapterNumber:String(base+k+1),courseId:UI.chCourse,subjectId:UI.chSubject,order:base+k+1,active:true,createdAt:new Date().toISOString()};});
 await db.ref().update(u);toast(lines.length+' chapters जुड़े');}
function editChapter(id){const c=S.chapters.find(x=>x.id===id);openModal(`<h3>Edit Chapter</h3><label>Chapter No.</label><input id="ecNum" value="${esc(c.chapterNumber??'')}"><label>Name</label><input id="ecName" value="${esc(c.name)}"><label>Order</label><input id="ecOrder" type="number" value="${c.order||1}">
 <div class="acts" style="margin-top:14px"><button class="btn" onclick="saveChapter('${id}')">Save</button><button class="btn gy" onclick="closeModal()">Cancel</button></div>`);}
async function saveChapter(id){const u={},n=$('ecName').value.trim(),num=$('ecNum').value.trim();u[`chapters_v3/${id}/name`]=n;u[`chapters_v3/${id}/chapterNumber`]=num;u[`chapters_v3/${id}/order`]=+$('ecOrder').value||1;
 const lbl=chLabel({name:n,chapterNumber:num});S.materials.filter(m=>m.chapterId===id).forEach(m=>u[`materials_v3/${m.id}/chapterName`]=lbl);await db.ref().update(u);closeModal();toast('Saved');}
async function delChapter(id){const nm=S.materials.filter(m=>m.chapterId===id).length;if(!confirm(`Chapter delete करें?${nm?`\n${nm} materials "Unassigned" हो जाएँगे.`:''}`))return;
 const u={};u[`chapters_v3/${id}`]=null;S.materials.filter(m=>m.chapterId===id).forEach(m=>{u[`materials_v3/${m.id}/chapterId`]='';u[`materials_v3/${m.id}/chapterName`]='';});await db.ref().update(u);toast('Deleted');}

// ================= MATERIALS =================
function filteredMaterials(){const f=UI.mf,q=f.q.toLowerCase();
 return S.materials.filter(m=>(!f.course||(m.courseId||m.cat)===f.course)&&(!f.subject||m.subjectId===f.subject)&&(!f.chapter||(f.chapter==='__none'?!m.chapterId:m.chapterId===f.chapter))&&(!f.type||m.type===f.type)
  &&(!f.access||(m.accessLevel||m.access||'public')===f.access)&&(!f.pub||(f.pub==='yes'?m.published!==false:m.published===false))
  &&(!q||[(m.title||m.tit),m.sub,m.description||m.desc,m.url].join(' ').toLowerCase().includes(q))).sort((a,b)=>parseD(b)-parseD(a));}
function setMF(k,v){UI.mf[k]=v;if(k==='course'){UI.mf.subject='';UI.mf.chapter='';}if(k==='subject')UI.mf.chapter='';UI.sel.clear();render();}

 <div><label>Access</label><select onchange="setMF('access',this.value)"><option value="">All</option><option value="public" ${f.access==='public'?'selected':''}>Free</option><option value="premium" ${f.access==='premium'?'selected':''}>Premium</option></select></div>
 <div><label>Status</label><select onchange="setMF('pub',this.value)"><option value="">All</option><option value="yes" ${f.pub==='yes'?'selected':''}>Published</option><option value="no" ${f.pub==='no'?'selected':''}>Draft/Hidden</option></select></div>

 <button class="btn sm ghost" onclick="exportMaterials()"><i class="fas fa-download"></i> Export CSV (${list.length})</button><button class="btn sm" onclick="go('upload')"><i class="fas fa-plus"></i> New</button></div></div>
 <div class="card"><h3>Results: ${list.length}${list.length>300?' (पहले 300 दिख रहे हैं)':''}</h3>
 <div class="acts" id="bulkBar" style="margin-bottom:10px;${UI.sel.size?'':'display:none'}"><b style="align-self:center;font-size:13px">${UI.sel.size} selected:</b>
 <button class="btn sm gr" onclick="bulkMat('pub',true)">Publish</button><button class="btn sm gy" onclick="bulkMat('pub',false)">Hide</button><button class="btn sm or" onclick="bulkMat('acc','premium')">Premium</button><button class="btn sm ghost" onclick="bulkMat('acc','public')">Free</button><button class="btn sm" onclick="bulkAssign()">Assign Chapter</button><button class="btn sm rd" onclick="bulkMat('del')">Delete</button></div>
 <div class="tw"><table><tr><th><input type="checkbox" style="width:auto" onchange="selAll(this.checked)"></th><th>Title</th><th>Course</th><th>Subject / Chapter</th><th>Type</th><th>Access</th><th>Status</th><th>Date</th><th>Actions</th></tr>
 ${shown.map(m=>{const acc=m.accessLevel||m.access||'public';return `<tr><td><input type="checkbox" style="width:auto" ${UI.sel.has(m.id)?'checked':''} onchange="tSel('${m.id}',this.checked)"></td>
 <td><b>${esc(m.title||m.tit)}</b>${m.priority&&m.priority!=='normal'?` <span class="tag t-off">${esc(m.priority)}</span>`:''}</td><td>${esc(m.courseId||m.cat)}</td>
 <td>${esc(m.sub||sName(m.subjectId))}<br><small style="color:var(--mu)">${m.chapterId?esc(m.chapterName||chName(m.chapterId)):'<span style="color:var(--er)">Unassigned</span>'}</small></td>
 <td><span class="tag" style="background:${tColor(m.type)}22;color:${tColor(m.type)}">${esc(m.type)}</span></td>
 <td><span class="tag ${acc==='premium'?'t-pr':'t-bl'}">${acc==='premium'?'Premium':'Free'}</span></td>
 <td><span class="tag ${m.published===false?'t-off':'t-ok'}" style="cursor:pointer" onclick="db.ref('materials_v3/${m.id}/published').set(${m.published===false})">${m.published===false?'Hidden':'Live'}</span></td>
 <td style="white-space:nowrap">${esc(m.date)}</td>
 <td class="acts"><a class="btn sm ghost" href="${esc(m.url)}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i></a><button class="btn sm ghost" onclick="editMat('${m.id}')"><i class="fas fa-pen"></i></button><button class="btn sm ghost" onclick="dupMat('${m.id}')" title="Copy"><i class="fas fa-copy"></i></button><button class="btn sm rd" onclick="delMat('${m.id}')"><i class="fas fa-trash"></i></button></td></tr>`;}).join('')||'<tr><td colspan=9 class="empty">कुछ नहीं मिला</td></tr>'}

function tSel(id,on){on?UI.sel.add(id):UI.sel.delete(id);const b=$('bulkBar');b.style.display=UI.sel.size?'':'none';b.querySelector('b').textContent=UI.sel.size+' selected:';}
function selAll(on){filteredMaterials().slice(0,300).forEach(m=>on?UI.sel.add(m.id):UI.sel.delete(m.id));render();}
async function bulkMat(op,val){const ids=[...UI.sel];if(!ids.length)return;
 if(op==='del'&&!confirm(ids.length+' materials हमेशा के लिए delete करें?'))return;const u={};
 ids.forEach(id=>{if(op==='del')u[`materials_v3/${id}`]=null;if(op==='pub')u[`materials_v3/${id}/published`]=val;if(op==='acc'){u[`materials_v3/${id}/accessLevel`]=val;u[`materials_v3/${id}/access`]=val;}});
 await db.ref().update(u);UI.sel.clear();toast('Done: '+ids.length);render();}
function bulkAssign(){const first=S.materials.find(m=>UI.sel.has(m.id))||{};const co=first.courseId||first.cat||'12th';
 openModal(`<h3>${UI.sel.size} materials को chapter से जोड़ें</h3><label>Course</label><select id="baC" onchange="$('baS').innerHTML=subjOpts(this.value,'');$('baS').onchange()">${coursesOpts(co)}</select>
 <label>Subject</label><select id="baS" onchange="$('baCh').innerHTML=chapOpts(this.value,'')">${subjOpts(co,first.subjectId)}</select><label>Chapter</label><select id="baCh">${chapOpts(first.subjectId||(S.subjects.find(s=>s.courseId===co)||{}).id,'')}</select>
 <div class="acts" style="margin-top:14px"><button class="btn" onclick="doBulkAssign()">Assign</button><button class="btn gy" onclick="closeModal()">Cancel</button></div>`);
 if(!first.subjectId)$('baS').onchange();}
async function doBulkAssign(){const c=$('baC').value,s=$('baS').value,ch=$('baCh').value,u={};
 UI.sel.forEach(id=>{u[`materials_v3/${id}/courseId`]=c;u[`materials_v3/${id}/cat`]=c;u[`materials_v3/${id}/subjectId`]=s;u[`materials_v3/${id}/sub`]=sName(s);u[`materials_v3/${id}/chapterId`]=ch;u[`materials_v3/${id}/chapterName`]=ch?chName(ch):'';});
 await db.ref().update(u);closeModal();UI.sel.clear();toast('Assigned');render();}
function matForm(m,pfx){const co=m.courseId||m.cat||'12th',acc=m.accessLevel||m.access||'public';
 return `<div class="row"><div><label>Course</label><select id="${pfx}C" onchange="$('${pfx}S').innerHTML=subjOpts(this.value,'');$('${pfx}S').onchange()">${coursesOpts(co)}</select></div>
 <div><label>Subject</label><select id="${pfx}S" onchange="$('${pfx}Ch').innerHTML=chapOpts(this.value,'')">${subjOpts(co,m.subjectId)}</select></div>
 <div><label>Chapter</label><select id="${pfx}Ch">${chapOpts(m.subjectId||(S.subjects.find(s=>s.courseId===co)||{}).id,m.chapterId)}</select></div></div>
 <div class="row"><div><label>Type</label><select id="${pfx}T">${typeOpts(m.type||'Notes')}</select></div><div><label>Access</label><select id="${pfx}A"><option value="public">Free</option><option value="premium" ${acc==='premium'?'selected':''}>Premium</option></select></div>
 <div><label>Priority</label><select id="${pfx}P">${['normal','high','urgent'].map(p=>`<option ${m.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
 <label>Title</label><input id="${pfx}Ti" value="${esc(m.title||m.tit||'')}"><label>Link (Drive / YouTube / PDF)</label><input id="${pfx}U" value="${esc(m.url||'')}"><label>Description</label><textarea id="${pfx}D">${esc(m.description||m.desc||'')}</textarea>
 <label class="chk"><input type="checkbox" id="${pfx}Pub" ${m.published===false?'':'checked'}> Published (students को दिखे)</label>`;}
function readMatForm(pfx){const c=$(pfx+'C').value,s=$(pfx+'S').value,ch=$(pfx+'Ch').value,acc=$(pfx+'A').value,t=$(pfx+'Ti').value.trim(),d=$(pfx+'D').value.trim();
 return {courseId:c,cat:c,subjectId:s,sub:sName(s),chapterId:ch,chapterName:ch?chName(ch):'',type:$(pfx+'T').value,title:t,tit:t,url:normalizeUrl($(pfx+'U').value),description:d,desc:d,priority:$(pfx+'P').value,accessLevel:acc,access:acc,published:$(pfx+'Pub').checked};}
function editMat(id){const m=S.materials.find(x=>x.id===id);openModal(`<h3>Edit Material</h3>${matForm(m,'em')}<div class="acts" style="margin-top:14px"><button class="btn" onclick="saveMat('${id}')">Save</button><button class="btn gy" onclick="closeModal()">Cancel</button></div>`);
 if(!m.subjectId)$('emS').onchange();}
async function saveMat(id){const d=readMatForm('em');if(!d.title||!d.url)return toast('Title और link ज़रूरी हैं','er');d.updated=new Date().toISOString();await db.ref('materials_v3/'+id).update(d);closeModal();toast('Saved');}
async function delMat(id){if(!confirm('यह material delete करें?'))return;await db.ref('materials_v3/'+id).remove();toast('Deleted');}
async function dupMat(id){const m={...S.materials.find(x=>x.id===id)};delete m.id;m.title=m.tit=(m.title||m.tit)+' (copy)';m.published=false;m.date=today();m.uploadTime=new Date().toISOString();await db.ref('materials_v3').push(m);toast('Copy बनी (Hidden)');}
function exportMaterials(){const L=filteredMaterials();const h=['course','subject','chapter','type','title','url','access','published','date'];
 download('materials.csv',[h.join(',')].concat(L.map(m=>[m.courseId||m.cat,m.sub||sName(m.subjectId),m.chapterName||chName(m.chapterId),m.type,m.title||m.tit,m.url,m.accessLevel||m.access,m.published!==false,m.date].map(csvCell).join(','))).join('\n'),'text/csv');}

// ================= UPLOAD =================
function vUpload(){const u=UI.up;
 return `<div class="title"><i class="fas fa-cloud-arrow-up" style="color:var(--p2)"></i> Upload New Material</div><div class="sub">Drive/YouTube link डालें — link अपने-आप साफ़ हो जाएगा।</div>
 <div class="card">${matForm({courseId:u.course,subjectId:u.subject,chapterId:u.chapter},'up')}
 <div id="upPrev" class="hint"></div>
 <div class="acts" style="margin-top:14px"><button class="btn gr" id="upBtn" onclick="uploadMat(false)"><i class="fas fa-upload"></i> Upload</button><button class="btn" onclick="uploadMat(true)"><i class="fas fa-plus"></i> Upload & add another</button></div></div>`;}
function updPreview(){const i=$('upU');if(!i)return;i.oninput=()=>{const v=normalizeUrl(i.value);$('upPrev').innerHTML=i.value?`<i class="fas fa-link"></i> ${linkKind(v)}: <code>${esc(v)}</code>`:'';};
 if(!UI.up.subject)$('upS').onchange&&$('upS').onchange();}
async function uploadMat(again){const d=readMatForm('up');if(!d.title)return toast('Title लिखें','er');if(!d.url||d.url==='https://')return toast('Link डालें','er');if(!d.subjectId)return toast('Subject चुनें','er');
 if(S.materials.some(m=>m.url===d.url&&m.subjectId===d.subjectId)&&!confirm('यही link इस subject में पहले से है। फिर भी upload करें?'))return;
 $('upBtn').disabled=true;d.date=today();d.uploadTime=new Date().toISOString();d.uploadedBy=ADMIN_EMAIL;d.plat='admin3';
 try{await db.ref('materials_v3').push(d);toast('Upload हो गया ✓');UI.up={course:d.courseId,subject:d.subjectId,chapter:d.chapterId};
  if(again){$('upTi').value='';$('upU').value='';$('upD').value='';$('upPrev').innerHTML='';$('upBtn').disabled=false;$('upTi').focus();}else go('materials');}
 catch(e){toast(e.message,'er');$('upBtn').disabled=false;}}

// ================= BULK =================
function vBulk(){return `<div class="title"><i class="fas fa-file-csv" style="color:var(--p2)"></i> Bulk Upload (CSV)</div><div class="sub">Excel/Google Sheet में list बनाकर CSV save करें और यहाँ upload करें।</div>
 <div class="card"><h3>CSV Format</h3><div class="hint" style="margin-bottom:8px">पहली line header होगी। Columns: <code>course, subject, chapter, type, title, url, access</code><br>course = 12th / 10th / BA / BSC / BCOM / Competitive · subject और chapter नाम से match होंगे (नहीं मिले तो बना दिए जाएँगे) · access = public या premium</div>
 <button class="btn sm ghost" onclick="download('sample.csv','course,subject,chapter,type,title,url,access\\n12th,Hindi,Eidgah,Notes,Eidgah Notes,https://drive.google.com/file/d/XXXX/view,public\\n12th,History,Chapter 1,Videos,History Ch 1 Lecture,https://youtu.be/XXXXXXXXXXX,premium','text/csv')"><i class="fas fa-download"></i> Sample CSV</button>
 <label>CSV File</label><input type="file" id="csvF" accept=".csv,text/csv" onchange="readCSV()"><label>या यहाँ paste करें</label><textarea id="csvT" placeholder="course,subject,chapter,type,title,url,access"></textarea>
 <label class="chk"><input type="checkbox" id="csvCreate" checked> नहीं मिले subject/chapter अपने-आप बनाएँ</label>
 <div class="acts" style="margin-top:12px"><button class="btn ghost" onclick="previewCSV()"><i class="fas fa-eye"></i> Preview</button><button class="btn gr" onclick="importCSV()"><i class="fas fa-upload"></i> Import</button></div></div><div id="csvOut"></div>`;}
function readCSV(){const f=$('csvF').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{$('csvT').value=e.target.result;previewCSV();};r.readAsText(f);}
function csvRows(){const rows=parseCSV($('csvT').value.trim());if(rows.length<2)return [];const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);
 return rows.slice(1).map(r=>({course:(r[ix('course')]||'').trim(),subject:(r[ix('subject')]||'').trim(),chapter:(r[ix('chapter')]||'').trim(),type:(r[ix('type')]||'Notes').trim()||'Notes',title:(r[ix('title')]||'').trim(),url:normalizeUrl(r[ix('url')]||''),access:((r[ix('access')]||'public').trim().toLowerCase()==='premium')?'premium':'public'}));}
function resolveCourse(c){const x=COURSES.find(k=>k.id.toLowerCase()===c.toLowerCase()||k.name.toLowerCase()===c.toLowerCase());return x?x.id:null;}
function previewCSV(){const R=csvRows();$('csvOut').innerHTML=`<div class="card"><h3>Preview (${R.length} rows)</h3><div class="tw"><table><tr><th>#</th><th>Course</th><th>Subject</th><th>Chapter</th><th>Type</th><th>Title</th><th>Check</th></tr>${R.slice(0,200).map((r,i)=>{
 const co=resolveCourse(r.course),sub=co&&S.subjects.find(s=>s.courseId===co&&s.name.toLowerCase()===r.subject.toLowerCase());let ok=co&&r.title&&r.url&&r.subject;
 return `<tr><td>${i+1}</td><td>${esc(r.course)}</td><td>${esc(r.subject)}${sub?'':' <span class="tag t-pr">new</span>'}</td><td>${esc(r.chapter)}</td><td>${esc(r.type)}</td><td>${esc(r.title)}</td><td>${ok?'<span class="tag t-ok">OK</span>':'<span class="tag t-off">'+(!co?'course?':'missing')+'</span>'}</td></tr>`;}).join('')}</table></div></div>`;}
async function importCSV(){const R=csvRows();if(!R.length)return toast('CSV खाली है','er');const create=$('csvCreate').checked;let ok=0,bad=0;const u={},newSub={},newCh={};
 const subs=[...S.subjects],chs=[...S.chapters];
 for(const r of R){const co=resolveCourse(r.course);if(!co||!r.title||!r.url||!r.subject){bad++;continue;}
  let s=subs.find(x=>x.courseId===co&&x.name.toLowerCase()===r.subject.toLowerCase());
  if(!s){if(!create){bad++;continue;}const k=db.ref('subjects_v3').push().key;s={id:k,name:r.subject,courseId:co,order:subs.filter(x=>x.courseId===co).length+1,active:true,createdAt:new Date().toISOString()};subs.push(s);const {id,...v}=s;u['subjects_v3/'+k]=v;}
  let c=null;if(r.chapter){c=chs.find(x=>x.subjectId===s.id&&(x.name.toLowerCase()===r.chapter.toLowerCase()||chLabel(x).toLowerCase()===r.chapter.toLowerCase()));
   if(!c&&create){const k=db.ref('chapters_v3').push().key,n=chs.filter(x=>x.subjectId===s.id).length+1;c={id:k,name:r.chapter,chapterNumber:String(n),courseId:co,subjectId:s.id,order:n,active:true,createdAt:new Date().toISOString()};chs.push(c);const {id,...v}=c;u['chapters_v3/'+k]=v;}}
  const k=db.ref('materials_v3').push().key;u['materials_v3/'+k]={courseId:co,cat:co,subjectId:s.id,sub:s.name,chapterId:c?c.id:'',chapterName:c?chLabel(c):'',type:r.type,title:r.title,tit:r.title,url:r.url,description:'',desc:'',priority:'normal',accessLevel:r.access,access:r.access,published:true,date:today(),uploadTime:new Date().toISOString(),uploadedBy:ADMIN_EMAIL,plat:'admin3-csv'};ok++;}
 if(ok)await db.ref().update(u);toast(`Import: ${ok} सफल, ${bad} छोड़े गए`,bad?'wa':'ok');if(ok)go('materials');}

// ================= USERS =================
function vUsers(){const q=UI.uq.toLowerCase();const L=S.users.filter(u=>!q||[u.name,u.email,u.cat].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.registered||0)-new Date(a.registered||0));
 return `<div class="title"><i class="fas fa-users" style="color:var(--p2)"></i> Students</div><div class="sub">Students जोड़ें, password बदलें, हटाएँ, list export करें।</div>
 <div class="card"><h3><i class="fas fa-user-plus" style="color:var(--ok)"></i> New Student</h3><div class="row"><div><label>Name</label><input id="nuN"></div><div><label>Email</label><input id="nuE" type="email"></div><div><label>Password</label><input id="nuP"></div><div><label>Course</label><select id="nuC">${coursesOpts('12th')}</select></div><div style="flex:0"><button class="btn" onclick="addUser()"><i class="fas fa-plus"></i> Add</button></div></div></div>
 <div class="card"><div class="row" style="margin-bottom:10px"><div style="flex:3"><input placeholder="Search name / email..." value="${esc(UI.uq)}" oninput="UI.uq=this.value;clearTimeout(window._u);window._u=setTimeout(()=>{render();const i=document.querySelectorAll('#main input')[4];i.focus();i.setSelectionRange(i.value.length,i.value.length)},400)"></div><div style="flex:0"><button class="btn ghost" onclick="exportUsers()"><i class="fas fa-download"></i> CSV</button></div></div>
 <div class="tw"><table><tr><th>Name</th><th>Email</th><th>Course</th><th>Score</th><th>Registered</th><th>Actions</th></tr>
 ${L.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.addedByAdmin?' <span class="tag t-gy">admin</span>':''}</td><td>${esc(u.email)}</td><td>${esc(u.cat||'-')}</td><td>${u.score??'-'}</td><td style="white-space:nowrap">${u.registered?new Date(u.registered).toLocaleDateString('en-IN'):'-'}</td>
 <td class="acts"><button class="btn sm ghost" onclick="editUser('${u.id}')"><i class="fas fa-pen"></i></button><button class="btn sm rd" onclick="delUser('${u.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan=6 class="empty">कोई student नहीं</td></tr>'}</table></div></div>`;}
async function addUser(){const n=$('nuN').value.trim(),e=$('nuE').value.trim().toLowerCase(),p=$('nuP').value;if(!n||!e||!p)return toast('सभी fields भरें','er');
 if(S.users.some(u=>(u.email||'').toLowerCase()===e))return toast('यह email पहले से है','wa');
 await db.ref('students_v3').push({name:n,email:e,pass:p,cat:$('nuC').value,score:0,registered:new Date().toISOString(),addedByAdmin:true});toast('Student जुड़ गया');}
function editUser(id){const u=S.users.find(x=>x.id===id);openModal(`<h3>Edit Student</h3><label>Name</label><input id="euN" value="${esc(u.name)}"><label>Email</label><input id="euE" value="${esc(u.email)}"><label>Course</label><select id="euC">${coursesOpts(u.cat)}</select><label>New Password (खाली छोड़ें तो नहीं बदलेगा)</label><input id="euP">
 <div class="acts" style="margin-top:14px"><button class="btn" onclick="saveUser('${id}')">Save</button><button class="btn gy" onclick="closeModal()">Cancel</button></div>`);}
async function saveUser(id){const d={name:$('euN').value.trim(),email:$('euE').value.trim().toLowerCase(),cat:$('euC').value};if($('euP').value)d.pass=$('euP').value;await db.ref('students_v3/'+id).update(d);closeModal();toast('Saved');}
async function delUser(id){if(!confirm('यह student delete करें?'))return;await db.ref('students_v3/'+id).remove();toast('Deleted');}
function exportUsers(){download('students.csv',['name,email,course,score,registered'].concat(S.users.map(u=>[u.name,u.email,u.cat,u.score,u.registered].map(csvCell).join(','))).join('\n'),'text/csv');}

// ================= ANNOUNCEMENTS =================
function vAnn(){const L=[...S.ann].sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
 return `<div class="title"><i class="fas fa-bullhorn" style="color:var(--p2)"></i> Announcements</div><div class="sub">सभी students या किसी एक course के लिए सूचना।</div>
 <div class="card"><h3>New Announcement</h3><label>Title</label><input id="anT"><label>Message</label><textarea id="anM"></textarea>
 <div class="row"><div><label>Priority</label><select id="anP"><option>normal</option><option>important</option><option>urgent</option></select></div><div><label>Target</label><select id="anG" onchange="$('anCw').style.display=this.value==='course_specific'?'':'none'"><option value="all">All Students</option><option value="course_specific">One Course</option></select></div><div id="anCw" style="display:none"><label>Course</label><select id="anC">${coursesOpts('12th')}</select></div></div>
 <button class="btn gr" style="margin-top:12px" onclick="addAnn()"><i class="fas fa-paper-plane"></i> Publish</button></div>
 <div class="card"><h3>Posted (${L.length})</h3>${L.map(a=>`<div style="border-bottom:1px solid var(--bd);padding:10px 0;display:flex;gap:10px"><div style="flex:1"><b>${esc(a.title)}</b> <span class="tag ${a.priority==='urgent'?'t-off':a.priority==='important'?'t-pr':'t-gy'}">${esc(a.priority)}</span> <span class="tag t-bl">${a.target==='course_specific'?esc(a.course):'All'}</span><div style="margin-top:4px;white-space:pre-wrap">${esc(a.message)}</div><small style="color:var(--mu)">${a.timestamp?new Date(a.timestamp).toLocaleString('en-IN'):''}</small></div><button class="btn sm rd" style="align-self:flex-start" onclick="if(confirm('Delete?'))db.ref('announcements_v3/${a.id}').remove()"><i class="fas fa-trash"></i></button></div>`).join('')||'<div class="empty">अभी कुछ नहीं</div>'}</div>`;}
async function addAnn(){const t=$('anT').value.trim(),m=$('anM').value.trim();if(!t||!m)return toast('Title और message लिखें','er');const g=$('anG').value;
 const d={title:t,message:m,priority:$('anP').value,target:g,timestamp:new Date().toISOString(),sentBy:ADMIN_EMAIL};if(g==='course_specific')d.course=$('anC').value;await db.ref('announcements_v3').push(d);toast('Published');render();}

// ================= CLEANUP TOOLS =================
function vTools(){
 const dupS={};S.subjects.forEach(s=>{const k=s.courseId+'|'+s.name.trim().toLowerCase();(dupS[k]=dupS[k]||[]).push(s);});const DS=Object.values(dupS).filter(a=>a.length>1);
 const dupU={};S.materials.forEach(m=>{if(!m.url)return;const k=m.url+'|'+(m.subjectId||m.sub);(dupU[k]=dupU[k]||[]).push(m);});const DM=Object.values(dupU).filter(a=>a.length>1);
 const un=S.materials.filter(m=>!m.chapterId).length,noSub=S.materials.filter(m=>!m.subjectId).length,emptyS=S.subjects.filter(s=>!S.chapters.some(c=>c.subjectId===s.id)&&!S.materials.some(m=>m.subjectId===s.id));
 return `<div class="title"><i class="fas fa-screwdriver-wrench" style="color:var(--p2)"></i> Cleanup Tools</div><div class="sub">Duplicate और अधूरे data को ठीक करें।</div>
 <div class="card"><h3><i class="fas fa-clone" style="color:var(--wa)"></i> Duplicate Subjects (${DS.length})</h3><div class="hint" style="margin-bottom:8px">एक ही course में एक नाम के कई subjects। "Merge" से सारे chapters और materials पहले वाले में चले जाएँगे और बाकी हट जाएँगे।</div>
 ${DS.map(g=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(cName(g[0].courseId))} → ${esc(g[0].name)}</b> <span class="tag t-pr">${g.length} copies</span><span style="font-size:12px;color:var(--mu)">${g.map(s=>S.chapters.filter(c=>c.subjectId===s.id).length+' ch/'+S.materials.filter(m=>m.subjectId===s.id).length+' mat').join(' · ')}</span><button class="btn sm or" style="margin-left:auto" onclick="mergeSubjects('${g.map(s=>s.id).join(',')}')"><i class="fas fa-code-merge"></i> Merge</button></div>`).join('')||'<div class="empty">कोई duplicate नहीं 👍</div>'}</div>
 <div class="card"><h3><i class="fas fa-link" style="color:var(--er)"></i> Same link दो बार (${DM.length})</h3>${DM.slice(0,50).map(g=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px">${esc(g[0].title||g[0].tit)} <span class="tag t-pr">${g.length}x</span> <button class="btn sm rd" onclick="delDupMat('${g.map(m=>m.id).join(',')}')">पुराने रखें, बाकी हटाएँ</button></div>`).join('')||'<div class="empty">कोई duplicate link नहीं 👍</div>'}</div>
 <div class="card"><h3><i class="fas fa-triangle-exclamation" style="color:var(--er)"></i> अधूरे Materials</h3><p>${un} materials किसी chapter से नहीं जुड़े, ${noSub} बिना subject के।</p><button class="btn sm" style="margin-top:8px" onclick="UI.mf={course:'',subject:'',chapter:'__none',type:'',access:'',pub:'',q:''};go('materials')">इन्हें देखें और assign करें</button></div>
 <div class="card"><h3><i class="fas fa-box-open"></i> खाली Subjects (${emptyS.length})</h3><div class="hint">जिनमें न chapter है न material।</div>${emptyS.length?`<div style="margin:8px 0;font-size:13px">${emptyS.map(s=>esc(s.courseId+' → '+s.name)).join(', ')}</div><button class="btn sm rd" onclick="delEmptySubjects()">सब हटाएँ</button>`:''}</div>`;}
async function mergeSubjects(ids){ids=ids.split(',');const keep=ids[0],rest=ids.slice(1);if(!confirm(`${rest.length} duplicate subjects को एक में merge करें?`))return;const u={},nm=sName(keep);
 rest.forEach(id=>{u['subjects_v3/'+id]=null;S.chapters.filter(c=>c.subjectId===id).forEach(c=>u[`chapters_v3/${c.id}/subjectId`]=keep);S.materials.filter(m=>m.subjectId===id).forEach(m=>{u[`materials_v3/${m.id}/subjectId`]=keep;u[`materials_v3/${m.id}/sub`]=nm;});});
 await db.ref().update(u);toast('Merged');}
async function delDupMat(ids){ids=ids.split(',');const L=ids.map(id=>S.materials.find(m=>m.id===id)).sort((a,b)=>parseD(a)-parseD(b));const u={};L.slice(1).forEach(m=>u['materials_v3/'+m.id]=null);if(!confirm(L.length-1+' copies हटाएँ?'))return;await db.ref().update(u);toast('Removed');}
async function delEmptySubjects(){const L=S.subjects.filter(s=>!S.chapters.some(c=>c.subjectId===s.id)&&!S.materials.some(m=>m.subjectId===s.id));if(!confirm(L.length+' खाली subjects हटाएँ?'))return;const u={};L.forEach(s=>u['subjects_v3/'+s.id]=null);await db.ref().update(u);toast('Removed');}

// ================= BACKUP =================
function vBackup(){return `<div class="title"><i class="fas fa-database" style="color:var(--p2)"></i> Backup & Restore</div><div class="sub">पूरा data एक file में save करें। कोई बड़ा बदलाव करने से पहले backup ज़रूर लें।</div>
 <div class="card"><h3><i class="fas fa-download" style="color:var(--ok)"></i> Backup</h3><p class="hint">Subjects, chapters, materials, students, announcements — सब एक JSON file में।</p><button class="btn gr" style="margin-top:10px" onclick="backup()"><i class="fas fa-download"></i> Download Backup</button></div>
 <div class="card"><h3><i class="fas fa-upload" style="color:var(--er)"></i> Restore</h3><p class="hint">ध्यान दें: restore करने पर file वाला data अभी के data की जगह ले लेगा।</p><input type="file" id="rsF" accept=".json" style="margin-top:10px"><button class="btn rd" style="margin-top:10px" onclick="restore()"><i class="fas fa-rotate"></i> Restore</button></div>`;}
async function backup(){const out={_meta:{app:'Smart Exam Academy',at:new Date().toISOString()}};for(const n of NODES){out[n]=(await db.ref(n).once('value')).val()||{};}
 download('smart-exam-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(out,null,1),'application/json');toast('Backup downloaded');}
function restore(){const f=$('rsF').files[0];if(!f)return toast('File चुनें','er');const r=new FileReader();r.onload=async e=>{try{const d=JSON.parse(e.target.result);const nodes=NODES.filter(n=>d[n]);if(!nodes.length)return toast('गलत backup file','er');
 if(!confirm(`Restore: ${nodes.join(', ')}\nअभी का data बदल जाएगा। पक्का?`))return;if(prompt('पक्का करने के लिए RESTORE लिखें')!=='RESTORE')return;const u={};nodes.forEach(n=>u[n]=d[n]);await db.ref().update(u);toast('Restored');}catch(err){toast('Error: '+err.message,'er');}};r.readAsText(f);}

// ================= START =================
auth.onAuthStateChanged(u=>{if(u&&(u.email||'').toLowerCase()===ADMIN_EMAIL)startApp();else if(u){auth.signOut();$('loginErr').textContent='यह admin account नहीं है';}});
</script>
