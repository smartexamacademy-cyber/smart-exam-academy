<style>
:root{--p:#1d4ed8;--p2:#2563eb;--bg:#f4f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px}
header{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;position:sticky;top:0;z-index:30}
.hd{max-width:1150px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}.brand img{width:38px;height:38px;border-radius:9px;background:#fff}
.brand b{font-size:17px;display:block;line-height:1.1}.brand small{font-size:11px;opacity:.85}
.search{flex:1;position:relative;max-width:460px}.search input{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;padding-left:34px;border-radius:22px}
.search input::placeholder{color:#dbeafe}.search i{position:absolute;left:12px;top:12px;color:#dbeafe}
.hbtn{background:#fff;color:var(--p);border:0;border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.ann{background:#fef3c7;color:#92400e;font-size:13px}.ann .in{max-width:1150px;margin:0 auto;padding:8px 14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.wrap{max-width:1150px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;border-radius:16px;padding:26px 22px;margin-bottom:14px;display:flex;gap:18px;align-items:center}
.hero h1{font-size:24px;margin-bottom:6px}.hero p{opacity:.9;font-size:14px;line-height:1.5}
.hero .st{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}.hero .st b{font-size:20px;display:block}.hero .st span{font-size:12px;opacity:.85}
.hero img{width:110px;height:110px;border-radius:22px;background:#fff;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.lbl{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.courses{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}
.courses button{border:1px solid var(--bd);background:#f8fafc;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--tx)}
.courses button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.crumb{font-size:13px;color:var(--mu);margin:4px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumb a{color:var(--p2);cursor:pointer}
h2.t{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.12)}
.sc .ic{width:44px;height:44px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.sc b{font-size:16px;display:block;margin-bottom:5px}.sc .m{font-size:12px;color:var(--mu)}
.sc .go{border-top:1px solid var(--bd);margin-top:12px;padding-top:9px;font-size:12px;color:var(--p2);font-weight:600;display:flex;justify-content:space-between}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt button{border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--tx)}
.filt button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.chap{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.chap .h{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.chap .h .n{background:#dbeafe;color:#1e40af;border-radius:8px;padding:3px 9px;font-size:12px}
.chap .h .c{margin-left:auto;font-size:12px;color:var(--mu);font-weight:500}
.chap .b{display:none;border-top:1px solid var(--bd)}.chap.open .b{display:block}.chap.open .h .fa-chevron-down{transform:rotate(180deg)}
.mat{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer}.mat:last-child{border-bottom:0}.mat:hover{background:#f8fafc}
.mat .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mat .tt{flex:1;min-width:0}.mat .tt b{display:block;font-size:14px}.mat .tt small{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.prem{background:#fef3c7;color:#92400e}
.empty{text-align:center;color:var(--mu);padding:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
.mb{background:#fff;border-radius:16px;width:100%;max-width:820px;max-height:94vh;overflow:auto}
.mb .mh{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}.mb .mh b{flex:1;font-size:15px}
.mb .x{border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px;font-size:16px}
.frame{position:relative;padding-top:56.25%;background:#000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame.doc{padding-top:120%}
.mbody{padding:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--p2);color:#fff;display:inline-flex;gap:7px;align-items:center}
.btn.gy{background:#e2e8f0;color:#1f2937}
.form{padding:18px}.form label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.err{color:#dc2626;font-size:13px;margin-top:8px}
.app{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:16px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.app h3{font-size:18px;margin-bottom:4px}.app p{opacity:.85;font-size:13px}
.wa{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #bbf7d0;border-radius:14px;padding:14px 16px}.wa>i{font-size:34px;color:#25D366}.wa b{display:block;font-size:15px}.wa span{font-size:12px;color:var(--mu)}.wa .wbtn{background:#25D366;color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:20px}
.fwa{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:40}
footer{text-align:center;color:var(--mu);font-size:12px;padding:24px 14px;line-height:1.8}footer a{color:var(--p2)}
#loading{text-align:center;padding:60px;color:var(--mu)}
@media(max-width:700px){.search{display:none}.hero{padding:20px 16px}.hero img{display:none}.hero h1{font-size:20px}.brand small{display:none}.hbtn span{display:none}}
.msearch{display:none;margin-bottom:12px;position:relative}.msearch i{position:absolute;left:12px;top:12px;color:var(--mu)}.msearch input{padding-left:34px;border-radius:22px}
@media(max-width:700px){.msearch{display:block}}
</style>
</head>

 <div class="brand" onclick="nav('')"><img src="sea-logo.png" alt=""><div><b>Smart Exam Academy</b><small>Student Learning Portal</small></div></div>
 <div class="search"><i class="fas fa-search"></i><input id="q1" placeholder="Notes, videos, MCQ खोजें..." oninput="onSearch(this.value)"></div>
 <div style="flex:1" class="sp"></div>
 <button class="hbtn" id="userBtn" onclick="userClick()"><i class="fas fa-user"></i><span>Student Login</span></button>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAmBGqLzAyMyYgADKOOZIv8GQm6fxxNdw4",authDomain:"smart-exam-academy-b7101.firebaseapp.com",
  databaseURL:"https://smart-exam-academy-b7101-default-rtdb.firebaseio.com",projectId:"smart-exam-academy-b7101",
  storageBucket:"smart-exam-academy-b7101.firebasestorage.app",messagingSenderId:"894421555422",appId:"1:894421555422:web:116442b9bcad4d6eba0a4f"});
const db=firebase.database();
const COURSES=[{id:'12th',name:'Class 12th',ic:'fa-graduation-cap'},{id:'10th',name:'Class 10th',ic:'fa-school'},{id:'BA',name:'BA',ic:'fa-user-graduate'},{id:'BSC',name:'B.Sc',ic:'fa-flask'},{id:'BCOM',name:'B.Com',ic:'fa-chart-line'},{id:'Competitive',name:'Competitive Exams',ic:'fa-bullseye'},{id:'PAID_SECTION',name:'Premium',ic:'fa-crown'},{id:'SOCIAL_LINKS',name:'Social Links',ic:'fa-share-nodes'}];
const TYPES={Notes:['Notes','fa-file-lines','#2196F3'],Videos:['Videos','fa-circle-play','#E91E63'],MCQ:['MCQ','fa-list-check','#00a844'],QuizTest:['Quiz','fa-circle-question','#FF9800'],Books:['Books','fa-book-open','#4CAF50'],QuestionBank:['Question Bank','fa-list-ol','#9C27B0'],Syllabus:['Syllabus','fa-clipboard-list','#00BCD4'],PDF:['PDF','fa-file-pdf','#F44336'],Link:['Link','fa-link','#607D8B'],LINK:['Link','fa-link','#607D8B'],Test:['Mock Test','fa-vial','#ff6d00'],Other:['Other','fa-folder','#795548']};
const COLORS=['#2563eb','#059669','#ea580c','#7c3aed','#dc2626','#0284c7','#db2777','#4f46e5','#0d9488'];
const S={subjects:[],chapters:[],materials:[],ann:[],loaded:0};
let route={c:'12th',s:'',type:''},q='',me=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=t=>TYPES[t]||TYPES.Other;
const cName=id=>(COURSES.find(c=>c.id===id)||{name:id}).name;
const chLabel=c=>(c.chapterNumber!==undefined&&c.chapterNumber!==''?'Chapter '+c.chapterNumber+' – ':'')+(c.name||'');
const acc=m=>m.accessLevel||m.access||'public';
const mTitle=m=>m.title||m.tit||'';
$('yr').textContent=new Date().getFullYear();
try{me=JSON.parse(localStorage.getItem('sea_student'));}catch(e){}

// ---------- data ----------
const visSub=()=>S.subjects.filter(s=>s.active!==false);
const visCh=()=>S.chapters.filter(c=>c.active!==false);
const visMat=()=>S.materials.filter(m=>m.published!==false);
[['subjects_v3','subjects'],['chapters_v3','chapters'],['materials_v3','materials'],['announcements_v3','ann']].forEach(([n,k])=>{
 db.ref(n).on('value',snap=>{const a=[];snap.forEach(ch=>{const v=ch.val();if(v&&typeof v==='object')a.push({id:ch.key,...v});});S[k]=a;S.loaded|=({subjects:1,chapters:2,materials:4,ann:8})[k];if((S.loaded&7)===7)render();},
 e=>{$('view').innerHTML='<div class="empty">Data load नहीं हो पाया। Internet check करें।</div>';});
});

// ---------- routing (#/12th/subjectId) ----------
function readHash(){const p=location.hash.replace(/^#\/?/,'').split('/');route.c=COURSES.some(c=>c.id===decodeURIComponent(p[0]))?decodeURIComponent(p[0]):(localStorage.getItem('sea_course')||'12th');route.s=p[1]?decodeURIComponent(p[1]):'';}
function nav(h){location.hash=h?'#/'+h:'#/'+route.c;}
window.addEventListener('hashchange',()=>{readHash();route.type='';render();window.scrollTo(0,0);});
readHash();

function onSearch(v){q=v.trim();$('q1').value=v;$('q2').value=v;clearTimeout(window._t);window._t=setTimeout(render,250);}

// ---------- render ----------
function render(){
 if((S.loaded&7)!==7)return;
 annBar();updUser();
 if(q) return $('view').innerHTML=vSearch();
 $('view').innerHTML=route.s?vSubject():vHome();
}
function annBar(){const L=[...S.ann].filter(a=>a.target!=='course_specific'||a.course===route.c).sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
 $('annBar').innerHTML=L.length?`<div class="ann" onclick="showAnn()"><div class="in"><i class="fas fa-bullhorn"></i><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>${esc(L[0].title)}:</b> ${esc(L[0].message)}</span>${L.length>1?`<span class="tag prem">+${L.length-1}</span>`:''}</div></div>`:'';}
function showAnn(){const L=[...S.ann].sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
 openM(`<div class="mh"><i class="fas fa-bullhorn" style="color:#f59e0b"></i><b>सूचनाएँ</b><button class="x" onclick="closeM()">×</button></div><div class="mbody">${L.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><b>${esc(a.title)}</b> ${a.priority==='urgent'?'<span class="tag" style="background:#fee2e2;color:#991b1b">Urgent</span>':''}<p style="margin-top:4px;white-space:pre-wrap">${esc(a.message)}</p><small style="color:var(--mu)">${a.timestamp?new Date(a.timestamp).toLocaleDateString('en-IN'):''}</small></div>`).join('')}</div>`);}

function courseBar(){return `<div class="card"><div class="lbl"><i class="fas fa-layer-group"></i> Course / Class चुनें</div><div class="courses">${COURSES.filter(c=>c.id!=='SOCIAL_LINKS'||visMat().some(m=>(m.courseId||m.cat)==='SOCIAL_LINKS')).map(c=>`<button class="${c.id===route.c?'on':''}" onclick="localStorage.setItem('sea_course','${c.id}');nav('${c.id}')"><i class="fas ${c.ic}"></i> ${c.name}</button>`).join('')}</div></div>`;}
function vHome(){
 const subs=visSub().filter(s=>s.courseId===route.c).sort((a,b)=>(a.order||0)-(b.order||0));
 const mats=visMat(),chs=visCh();
 const loose=mats.filter(m=>(m.courseId||m.cat)===route.c&&!subs.some(s=>s.id===m.subjectId));
 return `<div class="hero"><div style="flex:1"><h1>पढ़ाई अब आसान 📚</h1><p>Class 10th, 12th, BA, B.Sc, B.Com और Competitive Exams के notes, video lectures, MCQ और mock tests — सब एक जगह।</p>
 <div class="st"><div><b>${visSub().length}</b><span>Subjects</span></div><div><b>${chs.length}</b><span>Chapters</span></div><div><b>${mats.length}</b><span>Study Materials</span></div></div></div><img src="sea-logo.png" alt="Smart Exam Academy"></div>
 ${courseBar()}
 <div class="crumb"><i class="fas fa-house"></i> ${esc(cName(route.c))}</div>
 <h2 class="t"><i class="fas fa-book-open-reader" style="color:var(--p2)"></i> Subjects in ${esc(cName(route.c))}</h2><div class="sub">कोई subject चुनें — chapters, video lectures, notes और tests देखें।</div>
 <div class="grid">${subs.map((s,i)=>{const nc=chs.filter(c=>c.subjectId===s.id).length,nm=mats.filter(m=>m.subjectId===s.id).length;
  return `<div class="sc" onclick="nav('${route.c}/${s.id}')"><div class="ic" style="background:${COLORS[i%COLORS.length]}"><i class="fas fa-book"></i></div><b>${esc(s.name)}</b><div class="m"><i class="fas fa-list"></i> ${nc} Chapters · <i class="fas fa-file"></i> ${nm} Materials</div><div class="go"><span>Open Subject</span><i class="fas fa-arrow-right"></i></div></div>`;}).join('')||'<div class="empty" style="grid-column:1/-1">इस course में जल्द ही subjects आएँगे।</div>'}</div>
 ${loose.length?`<h2 class="t" style="margin-top:20px"><i class="fas fa-folder-open" style="color:var(--p2)"></i> Other Materials</h2><div class="sub">&nbsp;</div><div class="chap open"><div class="b">${loose.map(matRow).join('')}</div></div>`:''}
 ${socialCard()}
 ${appCard()}`;
}
function vSubject(){
 const s=S.subjects.find(x=>x.id===route.s);if(!s)return `<div class="empty">Subject नहीं मिला। <a style="color:var(--p2)" onclick="nav('${route.c}')">वापस जाएँ</a></div>`;
 const chs=visCh().filter(c=>c.subjectId===s.id).sort((a,b)=>(a.order||0)-(b.order||0));
 let mats=visMat().filter(m=>m.subjectId===s.id);const types=[...new Set(mats.map(m=>m.type))];
 if(route.type)mats=mats.filter(m=>m.type===route.type);
 const un=mats.filter(m=>!m.chapterId||!chs.some(c=>c.id===m.chapterId));
 return `<div class="crumb"><a onclick="nav('${s.courseId}')"><i class="fas fa-house"></i> ${esc(cName(s.courseId))}</a> <i class="fas fa-chevron-right" style="font-size:10px"></i> ${esc(s.name)}</div>
 <h2 class="t"><i class="fas fa-book" style="color:var(--p2)"></i> ${esc(s.name)}</h2><div class="sub">${chs.length} chapters · ${visMat().filter(m=>m.subjectId===s.id).length} materials</div>
 ${types.length>1?`<div class="filt"><button class="${!route.type?'on':''}" onclick="route.type='';render()">All</button>${types.map(t=>`<button class="${route.type===t?'on':''}" onclick="route.type='${esc(t)}';render()"><i class="fas ${T(t)[1]}"></i> ${T(t)[0]}</button>`).join('')}</div>`:''}
 ${chs.map((c,i)=>{const L=mats.filter(m=>m.chapterId===c.id);return `<div class="chap ${i===0||chs.length<=3?'open':''}"><div class="h" onclick="this.parentNode.classList.toggle('open')"><span class="n">${esc(c.chapterNumber||i+1)}</span><span>${esc(c.name)}</span><span class="c">${L.length} items</span><i class="fas fa-chevron-down" style="color:var(--mu);transition:.2s"></i></div><div class="b">${L.map(matRow).join('')||'<div class="empty" style="padding:16px">इस chapter में अभी material नहीं है।</div>'}</div></div>`;}).join('')}
 ${un.length?`<div class="chap open"><div class="h" onclick="this.parentNode.classList.toggle('open')"><span class="n"><i class="fas fa-folder"></i></span><span>General Materials</span><span class="c">${un.length} items</span><i class="fas fa-chevron-down" style="color:var(--mu)"></i></div><div class="b">${un.map(matRow).join('')}</div></div>`:''}
 ${!chs.length&&!un.length?'<div class="empty">इस subject में जल्द ही material आएगा।</div>':''}`;
}
function vSearch(){const k=q.toLowerCase();const L=visMat().filter(m=>[mTitle(m),m.sub,m.description||m.desc,m.chapterName,m.type].join(' ').toLowerCase().includes(k)).slice(0,100);
 return `<h2 class="t"><i class="fas fa-search" style="color:var(--p2)"></i> "${esc(q)}" के results (${L.length})</h2><div class="sub">&nbsp;</div><div class="chap open"><div class="b">${L.map(m=>matRow(m,true)).join('')||'<div class="empty">कुछ नहीं मिला</div>'}</div></div>`;}
function matRow(m,showPath){const t=T(m.type),p=acc(m)==='premium';
 return `<div class="mat" onclick="openMat('${m.id}')"><div class="ic" style="background:${t[2]}1f;color:${t[2]}"><i class="fas ${t[1]}"></i></div><div class="tt"><b>${esc(mTitle(m))}</b><small>${t[0]}${showPath?' · '+esc((m.courseId||m.cat)+' → '+(m.sub||'')):''}${m.date?' · '+esc(m.date):''}</small></div>${p?'<span class="tag prem"><i class="fas fa-crown"></i> Premium</span>':''}<i class="fas fa-chevron-right" style="color:var(--mu)"></i></div>`;}
function socialCard(){return `<h2 class="t" style="margin-top:22px"><i class="fas fa-share-nodes" style="color:var(--p2)"></i> Social</h2><div class="sub">नए notes, videos और updates सबसे पहले पाने के लिए जुड़िए।</div>
 <a class="wa" href="https://whatsapp.com/channel/0029Vb8fSh0AYlUR87Elaj2C" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><div style="flex:1"><b>WhatsApp Channel</b><span>Smart Exam Academy को follow करें</span></div><span class="wbtn">Join</span></a>`;}
function appCard(){return `<div class="app" style="margin-top:20px"><i class="fas fa-mobile-screen-button" style="font-size:38px"></i><div style="flex:1;min-width:200px"><h3>Smart Exam Academy App</h3><p>Android app PhonePe App Store पर उपलब्ध है — "Smart Exam Academy" search करें।</p></div></div>`;}

// ---------- material viewer ----------
function ytId(u){const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null;}
function driveId(u){const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);return m?m[1]:null;}
function openMat(id){const m=S.materials.find(x=>x.id===id);if(!m)return;
 if(acc(m)==='premium'&&!me){return openLogin('यह Premium material है। देखने के लिए login करें।');}
 const u=m.url||'',y=ytId(u),d=driveId(u),t=T(m.type);let media='';
 if(y)media=`<div class="frame"><iframe src="https://www.youtube.com/embed/${y}" allowfullscreen allow="accelerometer; autoplay; encrypted-media; picture-in-picture"></iframe></div>`;
 else if(d)media=`<div class="frame doc"><iframe src="https://drive.google.com/file/d/${d}/preview" allow="autoplay"></iframe></div>`;
 openM(`<div class="mh"><i class="fas ${t[1]}" style="color:${t[2]}"></i><b>${esc(mTitle(m))}</b><button class="x" onclick="closeM()">×</button></div>${media}
 <div class="mbody"><div style="font-size:13px;color:var(--mu);margin-bottom:8px">${esc(cName(m.courseId||m.cat))} → ${esc(m.sub||'')}${m.chapterName?' → '+esc(m.chapterName):''}</div>${(m.description||m.desc)?`<p style="white-space:pre-wrap;margin-bottom:12px">${esc(m.description||m.desc)}</p>`:''}
 <a class="btn" href="${esc(u)}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> ${y?'YouTube पर खोलें':d?'Drive में खोलें / Download':'Open'}</a></div>`);}
function openM(h){$('mBody').innerHTML=h;$('modal').style.display='flex';document.body.style.overflow='hidden';}
function closeM(){$('modal').style.display='none';$('mBody').innerHTML='';document.body.style.overflow='';}

// ---------- student login / register ----------
function updUser(){$('userBtn').innerHTML=me?`<i class="fas fa-user-check"></i><span>${esc(me.name.split(' ')[0])}</span>`:'<i class="fas fa-user"></i><span>Student Login</span>';}
function userClick(){if(!me)return openLogin();openM(`<div class="form"><h3 style="margin-bottom:6px"><i class="fas fa-user-circle" style="color:var(--p2)"></i> ${esc(me.name)}</h3><p style="color:var(--mu)">${esc(me.email)}${me.cat?' · '+esc(cName(me.cat)):''}</p><div style="margin-top:16px;display:flex;gap:8px"><button class="btn gy" onclick="closeM()">Close</button><button class="btn" style="background:#dc2626" onclick="localStorage.removeItem('sea_student');me=null;closeM();render()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div>`);}
function openLogin(msg,reg){openM(`<div class="form"><div style="display:flex;align-items:center"><h3 style="flex:1"><i class="fas fa-user-circle" style="color:var(--p2)"></i> ${reg?'New Registration':'Student Login'}</h3><button class="x" onclick="closeM()">×</button></div>
 ${msg?`<p style="background:#fef3c7;color:#92400e;padding:9px;border-radius:8px;margin-top:10px;font-size:13px">${esc(msg)}</p>`:''}
 <form onsubmit="${reg?'doReg':'doLogin'}(event)">${reg?'<label>Full Name</label><input id="rN" required>':''}<label>Email</label><input id="lE" type="email" required autocomplete="username"><label>Password</label><input id="lP" type="password" required minlength="${reg?6:1}" autocomplete="${reg?'new-password':'current-password'}">
 ${reg?`<label>Course</label><select id="rC">${COURSES.slice(0,6).map(c=>`<option value="${c.id}" ${c.id===route.c?'selected':''}>${c.name}</option>`).join('')}</select>`:''}
 <div class="err" id="lErr"></div><button class="btn" style="width:100%;justify-content:center;margin-top:14px">${reg?'Register':'Login'}</button></form>
 <p style="text-align:center;margin-top:12px;font-size:13px">${reg?'पहले से account है? <a style="color:var(--p2);cursor:pointer" onclick="openLogin()">Login</a>':'नया student? <a style="color:var(--p2);cursor:pointer" onclick="openLogin(\'\',true)">Register करें</a>'}</p></div>`);}
const skey=e=>e.toLowerCase().trim().replace(/\./g,',');
async function findStudent(email){const s=await db.ref('students_v3/'+skey(email)).once('value');return s.exists()?{id:s.key,...s.val()}:null;}
function setMe(id,n,em,c){me={id,name:n||em,email:em,cat:c||''};localStorage.setItem('sea_student',JSON.stringify(me));closeM();render();}
async function doLogin(e){e.preventDefault();const em=$('lE').value.trim().toLowerCase(),p=$('lP').value;$('lErr').textContent='';
 try{let ok=false;try{await firebase.auth().signInWithEmailAndPassword(em,p);ok=true;}catch(x){}
  const u=await findStudent(em);
  if(!ok&&u&&u.pass===p){ok=true;if(p.length>=6){try{await firebase.auth().createUserWithEmailAndPassword(em,p);}catch(x){}}}
  if(ok)setMe(skey(em),u&&u.name,em,u&&(u.cat||u.course));else $('lErr').textContent='गलत email या password';}
 catch(err){$('lErr').textContent='Login नहीं हो पाया, फिर कोशिश करें';}}
async function doReg(e){e.preventDefault();const n=$('rN').value.trim(),em=$('lE').value.trim().toLowerCase(),p=$('lP').value,c=$('rC').value;$('lErr').textContent='';
 try{if(await findStudent(em)){$('lErr').textContent='यह email पहले से registered है — Login करें';return;}
  let uid='';try{const r=await firebase.auth().createUserWithEmailAndPassword(em,p);uid=r.user.uid;}catch(x){if(x&&x.code==='auth/email-already-in-use'){$('lErr').textContent='यह email पहले से registered है — Login करें';return;}}
  await db.ref('students_v3/'+skey(em)).set({name:n,email:em,pass:p,cat:c,course:c,score:0,uid:uid,registered:new Date().toISOString()});
  setMe(skey(em),n,em,c);}
 catch(err){$('lErr').textContent='Registration नहीं हो पाया';}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
</script>
</body>
