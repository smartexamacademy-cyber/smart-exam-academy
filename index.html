 viewer(mTitle(m),m.url||'',m.type,cName(m.courseId||m.cat)+' → '+(m.sub||'')+(m.chapterName?' → '+m.chapterName:''),m.description||m.desc||'');}

 openM(`<div class="mh"><i class="fas ${t[1]}" style="color:${t[2]}"></i><b>${esc(title)}</b><button class="x" onclick="closeM()">×</button></div>${media}

 ${href?'':'<p class="err">Link उपलब्ध नहीं है।</p>'}<a class="btn" href="${esc(href||'#')}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> ${y?'YouTube पर खोलें':d?'Drive में खोलें / Download':'Open'}</a></div>`);}

const P={courses:[],loaded:false,denied:false,cfg:{},user:null,authReady:false,enr:{},req:[],enrDenied:false,content:{},refs:[]};
const PAY_DEFAULT={upiId:'7009466362@ibl',payeeName:'Sonu Kumar'};
const num=v=>{if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='string'&&v.trim()!==''){const n=parseFloat(v);return isFinite(n)?n:null;}return null;};
const str=(o,...k)=>{for(const x of k){const v=o&&o[x];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v).trim();}return '';};
const rs=v=>{v=Number(v)||0;return '₹'+(v%1===0?String(v):v.toFixed(2));};
const isDenied=e=>!!e&&(e.code==='PERMISSION_DENIED'||/permission|denied/i.test(e.message||''));
const safeUrl=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';};
const fmtD=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

function parseCourse(id,c){const title=str(c,'title');if(!title)return null;const price=num(c.price)||0,mrp=num(c.mrp);
 return {id,title,description:str(c,'description','desc'),course:str(c,'course','courseId','cat'),semester:str(c,'semester'),price,
  mrp:mrp&&mrp>0?mrp:null,thumbnail:str(c,'thumbnail','thumb','image'),validityDays:(v=>v&&v>0?Math.floor(v):null)(num(c.validityDays)),
  active:String(c.active).toLowerCase()!=='false',order:Math.floor(num(c.order)||0),itemCount:Math.floor(num(c.itemCount)||0),
  videoCount:Math.floor(num(c.videoCount)||0),pdfCount:Math.floor(num(c.pdfCount)||0),testCount:Math.floor(num(c.testCount)||0)};}
const offPct=c=>c.mrp&&c.mrp>c.price?Math.floor((c.mrp-c.price)/c.mrp*100):0;
function payCfg(){const c=P.cfg||{};let upi=str(c,'upiId').replace(/\s/g,'');const pn=str(c,'payeeName','payee');
 if(!upi.includes('@'))upi=PAY_DEFAULT.upiId;
 return {upiId:upi,payeeName:pn||PAY_DEFAULT.payeeName,qrImageUrl:safeUrl(str(c,'qrImageUrl')),whatsapp:str(c,'supportWhatsapp','whatsapp'),instructions:str(c,'instructions')};}
function upiUri(cfg,amount,note){const tn=String(note||'').replace(/[^A-Za-z0-9 .,()\-]/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'Smart Exam Academy';
 return 'upi://pay?pa='+encodeURIComponent(cfg.upiId).replace(/%40/g,'@')+'&pn='+encodeURIComponent(cfg.payeeName)+'&am='+(Number(amount)||0).toFixed(2)+'&cu=INR&tn='+encodeURIComponent(tn);}
function waLink(w){w=String(w||'').trim();if(!w)return '';if(/^https?:\/\//i.test(w))return safeUrl(w);let d=w.replace(/\D/g,'');if(d.length===10)d='91'+d;return d.length>=11?'https://wa.me/'+d:'';}
function accessFor(cid){const e=P.enr[cid];if(e)return (!e.expiresAt||e.expiresAt>Date.now())?'ENROLLED':'EXPIRED';
 const L=P.req.filter(r=>r.courseId===cid).sort((a,b)=>b.createdAt-a.createdAt);if(!L.length)return 'BUY';
 return L[0].status==='pending'?'PENDING':L[0].status==='rejected'?'REJECTED':'BUY';}

db.ref('paid_courses_v3').on('value',snap=>{const a=[];snap.forEach(ch=>{const v=ch.val();if(v&&typeof v==='object'){const c=parseCourse(ch.key,v);if(c)a.push(c);}});
 P.courses=a.sort((x,y)=>x.order-y.order||x.title.localeCompare(y.title));P.loaded=true;P.denied=false;pRender();},

 if(u){const r1=db.ref('enrollments_v3/'+u.uid),f1=r1.on('value',s=>{const m={};s.forEach(c=>{const v=c.val()||{};const ex=num(v.expiresAt);m[c.key]={approvedAt:num(v.approvedAt)||0,expiresAt:ex&&ex>0?ex:null};});P.enr=m;P.enrDenied=false;pRender();},e=>{P.enrDenied=true;pRender();});
  const r2=db.ref('purchase_requests_v3/'+u.uid),f2=r2.on('value',s=>{const a=[];s.forEach(c=>{const v=c.val()||{};a.push({id:c.key,courseId:str(v,'courseId'),courseTitle:str(v,'courseTitle'),amount:num(v.amount)||0,utr:str(v,'utr'),status:(str(v,'status')||'pending').toLowerCase(),createdAt:num(v.createdAt)||0,note:str(v,'note')});});P.req=a;P.reqLoaded=true;pRender();},e=>{P.reqLoaded=true;pRender();});

 pRender();});

 const mine=P.user?L.filter(c=>accessFor(c.id)==='ENROLLED'):[];
 return head+(mine.length?`<h2 class="t"><i class="fas fa-circle-check" style="color:#16a34a"></i> मेरे Courses · My Purchased (${mine.length})</h2><div class="sub">&nbsp;</div><div class="pgrid">${mine.map(pcard).join('')}</div><div style="height:18px"></div>`:'')
  +`<h2 class="t"><i class="fas fa-crown" style="color:#f59e0b"></i> सभी Courses · All Courses</h2><div class="sub">कोई course चुनें — details, price और content देखें।</div><div class="pgrid">${L.map(pcard).join('')}</div>`
  +(me&&P.authReady&&!P.user?`<div class="card" style="margin-top:14px;background:#fff7ed;border-color:#fed7aa"><b><i class="fas fa-user-shield" style="color:#ea580c"></i> Account verify करें</b><p style="font-size:13px;color:var(--mu);margin:6px 0 10px">Course खरीदने और अपने purchased courses देखने के लिए login verify करना ज़रूरी है।</p><button class="btn" onclick="openVerify()">Verify करें</button></div>`:'');}

function vPremiumCourse(cid){const back=`<div class="crumb"><a onclick="nav('')"><i class="fas fa-house"></i> Home</a> <i class="fas fa-chevron-right" style="font-size:10px"></i> <a onclick="nav('premium')">Premium Courses</a></div>`;
 if(!P.loaded)return back+'<div id="loading"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i></div>';
 if(P.denied)return back+`<div class="empty">${DENIED_MSG}</div>`;
 const c=P.courses.find(x=>x.id===cid);
 const st=(me&&P.user)?accessFor(cid):'BUY';
 if(!c||(!c.active&&st!=='ENROLLED'))return back+`<div class="empty"><b>Course नहीं मिला</b><br>${c?'यह course अभी उपलब्ध नहीं है।':''} <a style="color:var(--p2);cursor:pointer" onclick="nav('premium')">सभी courses देखें</a></div>`;
 const r=latestReq(cid),e=P.enr[cid];let box='';
 if(me&&!P.authReady)box='<div class="empty" style="padding:14px"><i class="fas fa-spinner fa-spin"></i></div>';
 else if(st==='ENROLLED')box=`<div class="sbox ok"><i class="fas fa-circle-check"></i><div><b>आपने यह course खरीद लिया है ✓</b>${e&&e.expiresAt?`<span>Valid till ${esc(fmtD(e.expiresAt))}</span>`:'<span>Lifetime access</span>'}</div></div>`;
 else if(st==='PENDING')box=`<div class="sbox pend"><i class="fas fa-hourglass-half"></i><div><b>Payment verification pending</b><span>UTR: <b>${esc(r.utr)}</b> · ${rs(r.amount)}${r.createdAt?' · '+esc(fmtD(r.createdAt)):''}</span><span>Payment verify होने के बाद course अपने-आप खुल जाएगा (आम तौर पर 24 घंटे के अंदर)।</span></div></div>`;
 else if(st==='REJECTED')box=`<div class="sbox rej"><i class="fas fa-circle-xmark"></i><div><b>पिछली request reject हुई</b><span>UTR: ${esc(r.utr)}</span><span>${r.note?'कारण: '+esc(r.note):'Payment match नहीं हुआ।'}</span><span>सही UTR के साथ दोबारा request भेजें।</span></div></div><button class="btn buy" data-id="${esc(cid)}" onclick="buyCourse(this.dataset.id)"><i class="fas fa-rotate-right"></i> दोबारा try करें · ${rs(c.price)}</button>`;
 else if(st==='EXPIRED')box=`<div class="sbox rej"><i class="fas fa-clock"></i><div><b>Validity खत्म हो गई</b><span>Course दोबारा खरीदकर access पाएँ।</span></div></div><button class="btn buy" data-id="${esc(cid)}" onclick="buyCourse(this.dataset.id)"><i class="fas fa-cart-shopping"></i> दोबारा खरीदें · ${rs(c.price)}</button>`;
 else box=c.active?`<button class="btn buy" data-id="${esc(cid)}" onclick="buyCourse(this.dataset.id)"><i class="fas fa-cart-shopping"></i> Buy Now · खरीदें ${rs(c.price)}</button><div class="m" style="margin-top:8px;text-align:center">UPI से payment · Verification के बाद course unlock</div>`:'<div class="sbox rej"><div><b>अभी उपलब्ध नहीं</b></div></div>';
 if(me&&P.authReady&&!P.user&&st==='BUY'&&c.active)box+=`<p class="m" style="margin-top:8px;text-align:center"><i class="fas fa-user-shield"></i> पहले से खरीदा है? <a style="color:var(--p2);cursor:pointer" onclick="openVerify()">Account verify करें</a></p>`;
 return back+`<div class="pdet">${thumb(c,'pdth')}<div class="pdb"><h2 class="t">${esc(c.title)}</h2>${meta(c)?`<div class="sub" style="margin-bottom:6px">${meta(c)}</div>`:''}<div style="margin:8px 0">${priceHtml(c)}</div><div class="m"><i class="fas fa-clock"></i> ${validity(c)}</div><div class="pcc" style="margin-top:8px">${counts(c)}</div><div style="margin-top:14px">${box}</div></div></div>
 ${c.description?`<div class="card"><div class="lbl"><i class="fas fa-circle-info"></i> Course के बारे में</div><p style="white-space:pre-wrap;line-height:1.6">${esc(c.description)}</p></div>`:''}
 <div class="card"><div class="lbl"><i class="fas fa-list"></i> ${st==='ENROLLED'?'Course Content':'इस course में क्या है · What\'s inside'}</div>${st==='ENROLLED'?contentHtml(cid):`<div class="pcc">${counts(c)||'Videos, PDF notes और tests'}</div><p class="m" style="margin-top:10px"><i class="fas fa-lock"></i> Content locked — खरीदने के बाद यहीं खुलेगा।</p>`}</div>`;}

const PTYPE={video:'Videos',pdf:'PDF',test:'Test',link:'Link'};
function guessType(u){u=String(u).toLowerCase();return /youtube\.com|youtu\.be|\.mp4/.test(u)?'video':(/\.pdf|drive\.google\.com/.test(u)?'pdf':'link');}
function contentHtml(cid){const s=P.content[cid];
 if(!s){loadContent(cid);return '<div class="empty" style="padding:16px"><i class="fas fa-spinner fa-spin"></i> Content load हो रहा है...</div>';}
 if(s.state==='loading')return '<div class="empty" style="padding:16px"><i class="fas fa-spinner fa-spin"></i> Content load हो रहा है...</div>';
 if(s.state==='denied')return `<div class="empty" style="padding:16px">Access verify नहीं हुआ। थोड़ी देर बाद दोबारा try करें या WhatsApp support से बात करें।<br><button class="btn gy" style="margin-top:10px" data-id="${esc(cid)}" onclick="delete P.content[this.dataset.id];render()">दोबारा try करें</button></div>`;
 if(s.state==='err')return `<div class="empty" style="padding:16px">Content load नहीं हुआ। Internet check करें।<br><button class="btn gy" style="margin-top:10px" data-id="${esc(cid)}" onclick="delete P.content[this.dataset.id];render()">दोबारा try करें</button></div>`;
 if(!s.items.length)return '<div class="empty" style="padding:16px"><b>Content जल्द आ रहा है</b><br>Teacher अभी videos/PDF upload कर रहे हैं।</div>';
 return `<div class="chap open" style="margin:0"><div class="b">${s.items.map(it=>{const t=T(PTYPE[it.type]||'Link');return `<div class="mat" data-id="${esc(cid)}" data-item="${esc(it.id)}" onclick="openPaid(this.dataset.id,this.dataset.item)"><div class="ic" style="background:${t[2]}1f;color:${t[2]}"><i class="fas ${t[1]}"></i></div><div class="tt"><b>${esc(it.title)}</b><small>${t[0]}${it.subject?' · '+esc(it.subject):''}</small></div><i class="fas fa-chevron-right" style="color:var(--mu)"></i></div>`;}).join('')}</div></div>`;}
async function loadContent(cid){P.content[cid]={state:'loading',items:[]};
 try{const s=await db.ref('paid_content_v3/'+cid).once('value');const a=[];
  s.forEach(c=>{const v=c.val()||{};const url=str(v,'url','link');if(!url)return;a.push({id:c.key,title:str(v,'title','tit')||'Lesson',type:(str(v,'type').toLowerCase()||guessType(url)),url,subject:str(v,'subject','sub'),order:Math.floor(num(v.order)||0)});});
  a.sort((x,y)=>x.order-y.order||x.title.localeCompare(y.title));P.content[cid]={state:'ok',items:a};}
 catch(e){P.content[cid]={state:isDenied(e)?'denied':'err',items:[]};}
 if(route.p&&route.pc===cid)render();}
function openPaid(cid,iid){const s=P.content[cid];const it=s&&s.items.find(x=>x.id===iid);if(!it)return;const c=P.courses.find(x=>x.id===cid);
 viewer(it.title,it.url,PTYPE[it.type]||'Link',(c?c.title:'')+(it.subject?' → '+it.subject:''),'');}

function buyCourse(cid){if(!me)return openLogin('Premium course खरीदने के लिए पहले login करें।');
 if(!P.authReady)return;if(!P.user)return openVerify(cid);const st=accessFor(cid);if(st==='PENDING'||st==='ENROLLED')return render();openPay(cid);}
function openVerify(cid){openM(`<div class="form"><div style="display:flex;align-items:center"><h3 style="flex:1"><i class="fas fa-user-shield" style="color:var(--p2)"></i> Account verify करें</h3><button class="x" onclick="closeM()">×</button></div>
 <p style="background:#eff6ff;color:#1e3a8a;padding:9px;border-radius:8px;margin-top:10px;font-size:13px">Course खरीदने के लिए आपका login verify होना ज़रूरी है। अपना email और password डालें (Firebase account नहीं है तो इसी password से बन जाएगा)।</p>
 <form data-id="${esc(cid||'')}" onsubmit="doVerify(event,this.dataset.id)"><label>Email</label><input id="vE" type="email" required autocomplete="username" value="${esc(me&&me.email||'')}"><label>Password (min 6)</label><input id="vP" type="password" required minlength="6" autocomplete="current-password">
 <div class="err" id="vErr"></div><button class="btn" id="vBtn" style="width:100%;justify-content:center;margin-top:14px">Verify</button></form>
 <p style="text-align:center;margin-top:12px;font-size:13px">Password याद नहीं? <a style="color:var(--p2);cursor:pointer" onclick="doReset()">Password reset email भेजें</a></p></div>`);}
async function ensureFb(email,pass){const a=firebase.auth();email=email.trim().toLowerCase();
 if(!email.includes('@'))throw new Error('सही email डालें');if(pass.length<6)throw new Error('Password कम से कम 6 अक्षर का हो');
 try{return (await a.signInWithEmailAndPassword(email,pass)).user;}
 catch(x){const c=x&&x.code||'';if(!/user-not-found|wrong-password|invalid-credential|invalid-login-credentials/.test(c))throw new Error('Login fail: internet check करें');
  try{return (await a.createUserWithEmailAndPassword(email,pass)).user;}
  catch(y){if(y&&y.code==='auth/email-already-in-use')throw new Error('इस email का account पहले से है, पर password गलत है। "Password reset email भेजें" दबाएँ।');throw new Error('Account verify नहीं हुआ। फिर कोशिश करें।');}}}
async function doVerify(e,cid){e.preventDefault();$('vErr').textContent='';$('vBtn').disabled=true;
 try{await ensureFb($('vE').value,$('vP').value);closeM();render();if(cid)afterVerify(cid,0);}
 catch(x){$('vErr').textContent=x.message;$('vBtn').disabled=false;}}
function afterVerify(cid,n){if(!P.user||!P.reqLoaded){if(n<15)setTimeout(()=>afterVerify(cid,n+1),300);return;}if(['BUY','REJECTED','EXPIRED'].includes(accessFor(cid)))openPay(cid);}
async function doReset(){const em=($('vE')&&$('vE').value||'').trim().toLowerCase();if(!em.includes('@')){$('vErr').textContent='पहले ऊपर अपना email डालें';return;}
 try{await firebase.auth().sendPasswordResetEmail(em);$('vErr').style.color='#16a34a';$('vErr').textContent='Reset link '+em+' पर भेज दिया गया है। Email देखें, नया password बनाएँ और फिर Verify करें।';}
 catch(x){$('vErr').textContent='Reset email नहीं भेजा जा सका। Email check करें।';}}

function qrDataUrl(text){try{if(typeof qrcode!=='function')return '';const qr=qrcode(0,'M');qr.addData(text);qr.make();return qr.createDataURL(6,4);}catch(e){return '';}}
function openPay(cid){const c=P.courses.find(x=>x.id===cid);if(!c)return;const cfg=payCfg(),upi=upiUri(cfg,c.price,c.title),qr=qrDataUrl(upi),wa=waLink(cfg.whatsapp);
 openM(`<div class="mh"><i class="fas fa-indian-rupee-sign" style="color:#16a34a"></i><b>Payment · भुगतान</b><button class="x" onclick="closeM()">×</button></div><div class="mbody">
 <div class="paysum"><b>${esc(c.title)}</b><span class="pr">${rs(c.price)}</span></div>
 <div class="lbl" style="margin-top:14px">Step 1: UPI app से pay करें · ${rs(c.price)}</div>
 <a class="btn buy" href="${esc(upi)}"><i class="fas fa-mobile-screen-button"></i> UPI App से Pay करें (PhonePe / GPay / Paytm)</a>
 <div class="upirow"><div style="flex:1;min-width:0"><small>UPI ID</small><b id="upiId">${esc(cfg.upiId)}</b><small>Pay to: ${esc(cfg.payeeName)}</small></div><button class="btn gy" type="button" onclick="copyUpi()"><i class="fas fa-copy"></i> Copy UPI ID</button></div>
 <p class="m">अगर app payment रोक दे तो UPI ID copy करके manually exact ${rs(c.price)} pay करें।</p>
 <div class="qrs">${qr?`<div class="qrb"><img src="${qr}" alt="UPI QR" id="upiQr"><small>UPI QR (${rs(c.price)}) — किसी दूसरे phone से scan करें</small></div>`:''}${cfg.qrImageUrl?`<div class="qrb"><img src="${esc(cfg.qrImageUrl)}" alt="Owner QR" onerror="this.parentNode.remove()"><small>Owner QR</small></div>`:''}</div>
 <div class="steps">${cfg.instructions?esc(cfg.instructions):`1. ऊपर के button से या QR scan करके exact ${rs(c.price)} pay करें।<br>2. Payment के बाद UPI app में 12 अंक का UTR / UPI Ref No. दिखेगा।<br>3. वह UTR नीचे डालकर Submit करें। Verification के बाद course खुल जाएगा।`}</div>
 <div class="lbl" style="margin-top:16px">Step 2: Payment details भेजें</div>
 <form data-id="${esc(cid)}" onsubmit="submitPay(event,this.dataset.id)"><label class="fl">UTR / UPI Transaction ID</label><input id="pU" required maxlength="40" placeholder="e.g. 412345678901" autocomplete="off">
 <label class="fl">Mobile number</label><input id="pM" required inputmode="numeric" maxlength="14" placeholder="10 अंक का mobile number">
 <label class="fl">Name</label><input id="pN" required maxlength="100" value="${esc(me&&me.name||'')}">
 <div class="err" id="pErr"></div><button class="btn" id="pBtn" style="width:100%;justify-content:center;margin-top:14px"><i class="fas fa-paper-plane"></i> Submit · जमा करें</button></form>
 ${wa?`<a class="btn gy" style="width:100%;justify-content:center;margin-top:10px" href="${esc(wa)}" target="_blank" rel="noopener"><i class="fab fa-whatsapp" style="color:#25D366"></i> Payment में दिक्कत? WhatsApp करें</a>`:''}</div>`);}
function copyUpi(){const t=$('upiId').textContent;const done=()=>{$('upiId').insertAdjacentHTML('afterend','<small style="color:#16a34a" id="cpOk"> UPI ID copy हो गई ✓</small>');setTimeout(()=>{const x=$('cpOk');if(x)x.remove();},2000);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fbCopy(t,done));else fbCopy(t,done);}
function fbCopy(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){}a.remove();}
const cleanUtr=r=>String(r||'').trim().replace(/[\s-]/g,'').toUpperCase();
const cleanPhone=r=>{const d=String(r||'').replace(/\D/g,'');return d.length===12&&d.startsWith('91')?d.slice(2):d;};
async function submitPay(e,cid){e.preventDefault();const c=P.courses.find(x=>x.id===cid);if(!c)return;const err=$('pErr');err.textContent='';
 const utr=cleanUtr($('pU').value),ph=cleanPhone($('pM').value),nm=$('pN').value.trim();
 if(!/^[A-Z0-9]{6,30}$/.test(utr))return err.textContent='सही UTR डालें (6–30 अक्षर/अंक)';
 if(!/^\d{10}$/.test(ph))return err.textContent='10 अंक का सही mobile number डालें';
 if(!nm)return err.textContent='अपना नाम डालें';
 const u=firebase.auth().currentUser;if(!u){closeM();return openVerify(cid);}
 $('pBtn').disabled=true;
 try{const ref=db.ref('purchase_requests_v3/'+u.uid).push();
  await ref.set({courseId:c.id,courseTitle:c.title.slice(0,200),amount:c.price,utr,name:nm.slice(0,100),email:String(u.email||(me&&me.email)||'').slice(0,200),phone:ph,status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});
  closeM();render();openM(`<div class="form" style="text-align:center"><i class="fas fa-circle-check" style="font-size:44px;color:#16a34a"></i><h3 style="margin:10px 0 6px">Request भेज दी गई ✓</h3><p style="color:var(--mu);font-size:13px">UTR: <b>${esc(utr)}</b><br>Payment verify होने के बाद course अपने-आप खुल जाएगा (आम तौर पर 24 घंटे के अंदर)।</p><button class="btn" style="margin-top:14px" onclick="closeM()">OK</button></div>`);}
 catch(x){$('pBtn').disabled=false;err.textContent=isDenied(x)?'Request save नहीं हुई (permission)। कृपया दोबारा login करें या थोड़ी देर बाद try करें।':'Request save नहीं हुई। Internet check करें।';}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
</script>
</body>
