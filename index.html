const num=v=>{if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='string'&&v.trim()!==''){const n=parseFloat(v);return isFinite(n)?n:null;}return null;};
const str=(o,...k)=>{for(const x of k){const v=o&&o[x];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v).trim();}return '';};
const rs=v=>{v=Number(v)||0;return '₹'+(v%1===0?String(v):v.toFixed(2));};
const isDenied=e=>!!e&&(e.code==='PERMISSION_DENIED'||/permission|denied/i.test(e.message||''));
const safeUrl=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';};
const fmtD=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const DEFAULT_FEATURES=['Recorded Video Class','Unit Wise PDF Notes','Unit Wise MCQ Test','Objective & Subjective','PYQ (पिछले साल के प्रश्न)','Doubt Support'];
function parseCourse(id,c){const title=str(c,'title');if(!title)return null;const price=num(c.price)||0,mrp=num(c.mrp);
 let f=c.features;f=Array.isArray(f)?f:(f&&typeof f==='object'?Object.values(f):String(f||'').split('\n'));f=f.map(x=>String(x||'').trim()).filter(Boolean);
 return {id,title,description:str(c,'description','desc'),course:str(c,'course','courseId','cat'),semester:str(c,'semester'),price,isFree:price<=0,
  mrp:mrp&&mrp>price?mrp:null,thumbnail:str(c,'thumbnail','thumb','image'),validityDays:(v=>v&&v>0?Math.floor(v):null)(num(c.validityDays)),
  active:String(c.active).toLowerCase()!=='false',order:Math.floor(num(c.order)||0),itemCount:Math.floor(num(c.itemCount)||0),
  videoCount:Math.floor(num(c.videoCount)||0),pdfCount:Math.floor(num(c.pdfCount)||0),testCount:Math.floor(num(c.testCount)||0),features:f.length?f:DEFAULT_FEATURES};}
const offPct=c=>c.mrp?Math.floor((c.mrp-c.price)/c.mrp*100):0;
function validityLabel(d){if(!d)return 'Lifetime';if(d%365===0){const y=d/365;return y+' YEAR'+(y>1?'S':'');}if(d>=28){const m=Math.round(d/30.4);return m+' MONTH'+(m>1?'S':'');}return d+' DAY'+(d>1?'S':'');}
function accessFor(cid){const e=P.enr[cid];if(e)return (!e.expiresAt||e.expiresAt>Date.now())?'ENROLLED':'EXPIRED';return 'BUY';}
const owned=c=>P.user&&accessFor(c.id)==='ENROLLED';
const pendingReq=cid=>P.req.filter(r=>r.courseId===cid&&r.status==='pending').sort((a,b)=>b.createdAt-a.createdAt)[0];
const sameSem=(a,b)=>a.course.trim().toLowerCase()===b.course.trim().toLowerCase()&&a.semester.trim()===b.semester.trim();
const demoFor=c=>c.isFree?null:P.courses.find(x=>x.isFree&&x.active&&x.id!==c.id&&sameSem(x,c)&&(c.semester||c.course));
const paidFor=c=>c.isFree?P.courses.find(x=>!x.isFree&&x.active&&sameSem(x,c)&&(c.semester||c.course)):null;

 P.raw=raw;P.courses=a.sort((x,y)=>x.order-y.order||x.title.localeCompare(y.title));P.loaded=true;P.denied=false;

// ---------- folders (same rules as app v1.0.26: subject path → nested folders, empty ones hidden) ----------
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const keyFor=s=>(norm(s)||'general').replace(/[.#$\[\]\/]/g,'_');
const cleanPath=s=>String(s||'').trim().replace(/\s*\/\s*/g,'/').replace(/^\/+|\/+$/g,'').trim();
function kindOf(t,u){t=norm(t);if(['video','videos','lecture','live','live class','liveclass'].includes(t))return 'video';if(['pdf','notes','file'].includes(t))return 'pdf';if(['test','quiz','mcq','quiztest'].includes(t))return 'test';
 u=String(u||'').toLowerCase();return /youtube\.com|youtu\.be|\.mp4/.test(u)?'video':/\.pdf|drive\.google\.com/.test(u)?'pdf':'link';}
function metasOf(cid){const f=(P.raw[cid]||{}).folders||{};return Object.entries(f).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>({key:k,name:str(v,'name'),order:num(v.order),parent:str(v,'parent')}));}
function segs(subject,metas){let rest=cleanPath(subject).replace(/\s+/g,' ');const G=[{id:'general',name:'General',meta:null}];if(!rest)return G;
 const out=[];let pk='',inMeta=true;
 while(rest){let m0=null,ml=-1;
  if(inMeta){const rn=norm(rest);for(const m of metas){if(norm(m.parent)!==norm(pk))continue;for(const lab of [cleanPath(m.name).replace(/\s+/g,' '),m.key.trim()]){if(!lab)continue;const ln=norm(lab);if((rn===ln||rn.startsWith(ln+'/'))&&ln.length>ml){m0=m;ml=ln.length;}}}}
  if(m0){out.push({id:keyFor(m0.key||m0.name),name:m0.name||m0.key,meta:m0});pk=m0.key;rest=ml>=rest.length?'':rest.slice(ml).replace(/^\/+/,'').trim();}
  else{inMeta=false;const i=rest.indexOf('/');const part=(i<0?rest:rest.slice(0,i)).trim();rest=i<0?'':rest.slice(i+1).trim();if(part)out.push({id:keyFor(part),name:part,meta:null});}}
 return out.length?out:G;}
function buildTree(items,metas){const root={children:new Map(),items:[]};let n=0;
 items.forEach(it=>{let node=root;segs(it.subject,metas).forEach(s=>{if(!node.children.has(s.id))node.children.set(s.id,{id:s.id,name:s.name,meta:s.meta,seen:n++,children:new Map(),items:[]});node=node.children.get(s.id);});node.items.push(it);});
 const fin=node=>{let all=[...node.items];const kids=[...node.children.values()].map(c=>{fin(c);return c;}).filter(c=>c.all.length);
  kids.sort((a,b)=>((a.meta&&a.meta.order!=null)?a.meta.order:1e5+a.seen)-((b.meta&&b.meta.order!=null)?b.meta.order:1e5+b.seen)||a.name.localeCompare(b.name));
  kids.forEach(k=>all=all.concat(k.all));node.kids=kids;node.all=all;return node;};
 return fin(root);}
function loadContent(cid){const c=P.courses.find(x=>x.id===cid);if(!c)return;
 const parse=obj=>{const a=[];Object.entries(obj||{}).forEach(([k,v])=>{if(!v||typeof v!=='object')return;const url=str(v,'url','link');if(!url)return;a.push({id:k,title:str(v,'title','tit')||'Lesson',kind:kindOf(str(v,'type'),url),url,subject:str(v,'subject','sub'),order:Math.floor(num(v.order)||0),pdf:str(v,'pdf','pdfUrl'),testId:str(v,'testId','test')});});
  return a.sort((x,y)=>x.order-y.order||x.title.localeCompare(y.title));};
 if(c.isFree){P.content[cid]={state:'ok',items:parse((P.raw[cid]||{}).content)};return;}
 P.content[cid]={state:'loading',items:[]};
 db.ref('paid_content_v3/'+cid).once('value').then(s=>{P.content[cid]={state:'ok',items:parse(s.val())};},e=>{P.content[cid]={state:isDenied(e)?'denied':'err',items:[]};}).then(()=>{if(route.p&&route.pc===cid)render();});}

function vPremium(){if(route.pc)return vCourse(route.pc);
 const head=`<div class="crumb"><a onclick="nav('')"><i class="fas fa-house"></i> Home</a> <i class="fas fa-chevron-right" style="font-size:10px"></i> Courses</div>
 <div class="phero"><i class="fas fa-book-open"></i><div><h1>Paid Course & Free Demo</h1><p>पूरा कोर्स — video classes, unit-wise PDF notes और MCQ tests। Razorpay से सुरक्षित payment (UPI / Card / Net Banking) — payment होते ही course खुल जाता है।</p></div></div>`;

 const pool=items.filter(i=>tab==='content'||(tab==='test'?i.kind==='test':i.kind==='pdf'));
 if(!items.length)return head+upsell+'<div class="empty"><b>Content जल्द आ रहा है</b><br>Teacher अभी videos/PDF upload कर रहे हैं।</div>';
 if(fq.trim()){const k=norm(fq);const L=pool.filter(i=>norm(i.title+' '+i.subject).includes(k)).slice(0,150);
  return head+upsell+tabs+srch+`<div class="chap open"><div class="b">${L.map(i=>itemRow(cid,i,true)).join('')||'<div class="empty">कुछ नहीं मिला</div>'}</div></div>`;}
 const tree=buildTree(pool,metasOf(cid));let node=tree;const path=[];
 for(const id of route.f){const n=(node.kids||[]).find(k=>k.id===id);if(!n)break;path.push(n);node=n;}
 const base='premium/'+enc(cid);let acc=base;

 const here=base+route.f.slice(0,path.length).map(x=>'/'+enc(x)).join('');
 const fl=(node.kids||[]).map(k=>{const v=k.all.filter(i=>i.kind==='video').length,f=k.all.filter(i=>i.kind==='pdf'||i.kind==='link').length,t=k.all.filter(i=>i.kind==='test').length;
  const lab=[k.kids.length?k.kids.length+' folder'+(k.kids.length>1?'s':''):'',v?v+' video'+(v>1?'s':''):'',f?f+' file'+(f>1?'s':''):'',t?t+' test'+(t>1?'s':''):''].filter(Boolean).join(' | ');
  return `<div class="mat" onclick="nav('${here}/${enc(k.id)}')"><div class="ic" style="background:#fef3c7;color:#d97706"><i class="fas fa-folder"></i></div><div class="tt"><b>${esc(k.name)}</b><small>${esc(lab)}</small></div><i class="fas fa-chevron-right" style="color:var(--mu)"></i></div>`;}).join('');
 const il=(node===tree?tree.items:node.items).map(i=>itemRow(cid,i)).join('');
 return head+upsell+tabs+srch+crumb+`<div class="chap open"><div class="b">${fl}${il}${!fl&&!il?'<div class="empty">इस folder में अभी कुछ नहीं है।</div>':''}</div></div>`;}

async function workerCall(path,body){const u=firebase.auth().currentUser;if(!u)throw new Error('login');const tok=await u.getIdToken();
 const r=await fetch(WORKER+path,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
 let j={};try{j=await r.json();}catch(e){}j._status=r.status;return j;}
async function isVerified(u){if((u.providerData||[]).some(x=>x&&x.providerId==='google.com')||u.emailVerified)return true;
 try{const v=(await db.ref('email_otp_verified/'+u.uid).once('value')).val();if(v&&String(v.email||'').toLowerCase()===String(u.email||'').toLowerCase())return true;}catch(e){}
 try{const j=await workerCall('/status');if(j.ok&&j.verified)return true;}catch(e){}return false;}

 if(!me||!P.user)return openLogin('Course खरीदने के लिए पहले login करें।');
 if(owned(c))return nav('premium/'+encodeURIComponent(cid));
 const u=P.user;openM('<div class="form" style="text-align:center"><i class="fas fa-spinner fa-spin" style="font-size:26px;color:var(--p2)"></i><p style="margin-top:10px">थोड़ा रुकें...</p></div>');
 if(!(await isVerified(u)))return openOtp(cid);
 const ph=await getPhone(u.uid);if(ph!==null&&!phoneOk(ph))return openPhone(cid);
 startRzp(c,ph);}
function openOtp(cid){openM(`<div class="form"><div style="display:flex;align-items:center"><h3 style="flex:1"><i class="fas fa-envelope-circle-check" style="color:var(--p2)"></i> Email verify करें</h3><button class="x" onclick="closeM()">×</button></div>

 let last=null;

const PRACTICE_SYS="Aap Smart Exam Academy ke AI shikshak hain. Kaam: ek video class ke title aur ikai (unit) ke aadhaar par exam-style abhyas (practice) ke liye theek 5 MCQ banaiye, saral Hindi (Devanagari) mein. Har sawal ke 4 vikalp, sirf ek sahi. Sawal sirf usi topic ke hon jo title/unit se saaf hai; sahi tathya hi likhein, jis tathya ka pakka pata na ho us par sawal na banayein. Har sawal ki 1 line vyakhya (explanation) dein.\nJawab mein SIRF yeh JSON likhein, aur kuch nahi (na ACTION line, na markdown):\n{\"questions\":[{\"q\":\"sawal\",\"options\":[\"A\",\"B\",\"C\",\"D\"],\"answer\":0,\"explanation\":\"...\"}]}\n\"answer\" = sahi vikalp ka index 0-3.";
const practicePrompt=(t,w)=>'वीडियो का शीर्षक: "'+String(t).slice(0,160)+'"'+(w?'\nविषय / इकाई: '+String(w).slice(0,160):'')+'\nइस वीडियो के टॉपिक पर 5 MCQ का अभ्यास टेस्ट हिंदी में बनाइए (केवल JSON)।';
function parsePractice(r){const a=r.indexOf('{'),b=r.lastIndexOf('}');if(a<0||b<=a)return [];let o;try{o=JSON.parse(r.slice(a,b+1));}catch(e){return [];}
 const out=[];(Array.isArray(o.questions)?o.questions:[]).forEach((q,i)=>{if(!q||out.length>=5)return;const text=String(q.q||q.question||'').trim();const list=(Array.isArray(q.options)?q.options:[]).map(x=>String(x).trim()).filter(Boolean);
  let ans=Number.isInteger(q.answer)?q.answer:-1;if(!(ans>=0&&ans<list.length)){const s=String(q.answer??'').trim();ans=s.length===1&&/[A-Da-d]/.test(s)?s.toUpperCase().charCodeAt(0)-65:list.findIndex(x=>x.toLowerCase()===s.toLowerCase());}
  if(!text||list.length<2||!(ans>=0&&ans<list.length)||ans>3)return;out.push({q:text.slice(0,500),o:list.slice(0,4).map(x=>x.slice(0,200)),a:ans,e:String(q.explanation||'').trim().slice(0,400)});});return out;}

   if(r.status===403){aiPush('e',AI_VERIFY_MSG);aiDraw();return;}if(!r.ok)throw 0;const url=URL.createObjectURL(await r.blob());
   if(id!==aiSpeakId)return;aiAudio=new Audio(url);await new Promise(ok=>{aiAudio.onended=ok;aiAudio.onerror=ok;aiAudio.play().catch(ok);});URL.revokeObjectURL(url);}
  catch(e){if(id===aiSpeakId){aiPush('e','आवाज़ अभी नहीं चल पाई। जवाब पढ़ लें।');aiDraw();}return;}}}
try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
