<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Smart Exam Academy Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         color: #ddd; font: 14px sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="player"></div>
<div id="msg"></div>
<script>
  var q = new URLSearchParams(location.search);
  var vid = (q.get('v') || '').replace(/[^\w-]/g, '').slice(0, 11);
  var start = parseInt(q.get('t') || '0', 10) || 0;
  var player = null, pendingRate = 1;
  function show(t) { var m = document.getElementById('msg'); m.textContent = t; m.style.display = 'flex'; }
  function setSpeed(r) { pendingRate = r; try { if (player && player.setPlaybackRate) player.setPlaybackRate(r); } catch (e) {} }
  function playPause() { try { if (!player) return; if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); } catch (e) {} }
  function seekBy(s) { try { if (player) player.seekTo(Math.max(0, player.getCurrentTime() + s), true); } catch (e) {} }
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: vid, host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 1, playsinline: 1, controls: 1, rel: 0, fs: 0, modestbranding: 1,
                    iv_load_policy: 3, disablekb: 1, start: start, origin: location.origin,
                    widget_referrer: location.href },
      events: {
        onReady: function (e) { try { e.target.setPlaybackRate(pendingRate); } catch (x) {} try { e.target.playVideo(); } catch (x) {} },
        onError: function (e) { show('Video नहीं चल पाया (code ' + e.data + '). Reload दबाएँ।'); }
      }
    });
  }
  if (!vid) { show('Video link सही नहीं है।'); }
  else {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () {
      document.getElementById('player').outerHTML =
        '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&playsinline=1&rel=0&fs=0&modestbranding=1&iv_load_policy=3" ' +
        'allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    };
    document.head.appendChild(tag);
  }
</script>
</body>
</html>
